# Copier configuration for copier-data-science template

# 9.6.0 introduced the _copier_operation variable, which post_gen.py relies on to tell a
# fresh copy from an update; older copier would silently take the wrong branch
_min_copier_version: "9.6.0"

_subdirectory: template

# Process all files as Jinja templates (not just .jinja files)
_templates_suffix: ""

_jinja_extensions:
  - jinja2_time.TimeExtension

# Questions - mirroring ccds.json structure

project_name:
  type: str
  default: "{{ _copier_conf.dst_path.name }}"
  when: false

repo_name:
  type: str
  default: "{{ project_name.lower().replace(' ', '_') }}"
  help: "Repository name (derived from project name)"

env_name:
  type: str
  default: "{{ project_name.lower().replace(' ', '_') }}"
  help: "Environment name (derived from project name)"

module_name:
  type: str
  default: "{{ repo_name.replace('-', '_') }}"
  help: "Python module name (optionally add lib_ prefix for namespace clarity)"

author_name:
  type: str
  default: ""
  help: "Author name (e.g., John Doe, Acme Corp)"
  placeholder: "Your name or organization"

description:
  type: str
  default: ""
  help: "Brief project description (e.g., ML pipeline for customer churn prediction)"
  placeholder: "A short description of the project"

python_version_choice:
  type: str
  choices:
    - "3.12"
    - "3.13"
    - "3.14"
    - other
  default: "3.13"
  help: "Python version"

python_version_custom:
  type: str
  default: "3.13"
  when: "{{ python_version_choice == 'other' }}"
  help: "Other Python version (e.g. 3.10)"
  placeholder: "3.10"

python_version_number:
  type: str
  default: "{{ python_version_custom if python_version_choice == 'other' else python_version_choice }}"
  when: false

# Dataset storage - simplified from nested dict
dataset_storage:
  type: str
  choices:
    - none
    - local
    - s3
    - azure
    - gcs
  default: none
  help: "Dataset storage (local or cloud provider)"

s3_bucket:
  type: str
  default: ""
  when: "{{ dataset_storage == 's3' }}"
  help: "S3 bucket name (e.g., my-project-data)"
  placeholder: "my-bucket-name"

s3_aws_profile:
  type: str
  default: "default"
  when: "{{ dataset_storage == 's3' }}"
  help: "AWS profile for S3 access (from ~/.aws/credentials)"

azure_container:
  type: str
  default: ""
  when: "{{ dataset_storage == 'azure' }}"
  help: "Azure container name (e.g., my-project-data)"
  placeholder: "my-container-name"

gcs_bucket:
  type: str
  default: ""
  when: "{{ dataset_storage == 'gcs' }}"
  help: "GCS bucket name (e.g., my-project-data)"
  placeholder: "my-bucket-name"

environment_manager:
  type: str
  choices:
    - uv
    - conda
    - virtualenv
    - none
  default: uv
  help: "Python environment manager"

env_location:
  type: str
  choices:
    - local
    - global
  default: local
  when: "{{ environment_manager == 'conda' }}"
  help: "Conda environment location (local .venv or global)"

dependency_file:
  type: str
  choices: "{{ ['pyproject.toml', 'requirements.txt', 'environment.yml'] if environment_manager == 'conda' else ['pyproject.toml', 'requirements.txt'] }}"
  default: pyproject.toml
  help: "Primary dependency file format"

pydata_packages:
  type: str
  choices:
    - none
    - basic
  default: none
  help: "Include basic PyData packages (numpy, pandas, scikit-learn, matplotlib)"

testing_framework:
  type: str
  choices:
    - pytest
    - unittest
    - none
  default: pytest
  help: "Testing framework"

linting_and_formatting:
  type: str
  choices:
    - ruff
    - flake8+black+isort
  default: ruff
  help: "Linting and formatting tools"

open_source_license:
  type: str
  choices:
    - MIT
    - BSD-3-Clause
    - No license file
  default: MIT
  help: "Open source license"

docs:
  type: str
  choices:
    - none
    - mkdocs
  default: none
  help: "Documentation framework"

include_code_scaffold:
  type: str
  default: "Yes"
  when: false

jupyter_kernel_support:
  type: str
  choices:
    - "Yes"
    - "No"
  default: "Yes"
  help: "Register Jupyter kernel during environment creation"

env_encryption:
  type: str
  choices:
    - "Yes"
    - "No"
  default: "Yes"
  help: "Enable .env file encryption with OpenSSL AES-256"

docker_support:
  type: str
  choices:
    - "No"
    - "Yes"
  default: "No"
  help: "Include Docker support with Dockerfile and Makefile targets"

docker_package_manager:
  type: str
  choices:
    - "uv"
    - "pip"
  default: "uv"
  help: "Package manager for Docker image"
  when: "{{ docker_support == 'Yes' }}"

package_repository:
  type: str
  choices:
    - "none"
    - "pypi"
    - "other"
  default: "none"
  help: "Publish the package to PyPI, to another repository, or not at all"

package_repository_url:
  type: str
  default: ""
  when: "{{ package_repository == 'other' }}"
  help: "Upload URL of the package repository"
  placeholder: "https://pypi.example.com/legacy/"
  validator: "{% if not package_repository_url %}An upload URL is required for 'other'{% endif %}"

ai_assistant:
  type: str
  choices:
    - "none"
    - "claude"
    - "codex"
    - "gemini"
    - "generic"
  default: "none"
  help: "AI assistant support - project instructions file and internal resources folder"

scaffold_agents:
  type: str
  choices:
    - "No"
    - "Yes"
  default: "No"
  help: "Scaffold an agents/ folder for deployable agentic resources (workflows, exported skills)"

github_actions:
  type: str
  choices:
    - "No"
    - "Yes"
  default: "No"
  help: "Include GitHub Actions workflow running lint and tests on push"

git_init:
  type: str
  choices:
    - "Yes"
    - "No"
  default: "Yes"
  help: "Initialize git repository with main branch"

custom_config:
  type: str
  default: ""
  help: "Path to custom config overlay (optional)"

# Computed cookiecutter namespace for template compatibility
# This creates a dict that allows {{ cookiecutter.var }} syntax in templates
cookiecutter:
  type: json
  default: "{}"
  when: false

_exclude:
  - copier.yml
  - "*.pyc"
  - __pycache__
  - .git

# Skip these files on update if they already exist (user-customized files)
# Note: tests/test_data.py is created by post_gen from tests/pytest/, not directly by template
# tests/ and docker/ can be created by post_gen during updates (from none to enabled)
_skip_if_exists:
  - README.md
  - CHANGELOG.md
  - data/**/README.md
  - models/README.md
  - notebooks/README.md
  - references/README.md
  - docs/README.md
  - .env
  - tests/test_data.py
  - tests/
  - docker/
  - CLAUDE.md
  # The assistant files and folders are created by post_gen, never rendered by copier, so
  # these entries do nothing at render time. They are still load-bearing on update:
  # copier feeds every _skip_if_exists match to `git apply --exclude`, and the update
  # patch runs AFTER the tasks. Without them the patch restores the very files post_gen
  # just deleted when switching assistant, leaving a switched-away tool still being read.
  - .claude/
  - AGENTS.md
  - GEMINI.md
  - .codex/
  - .gemini/
  - .agents/

  # Ordinary rendered template paths - skipped at render time so user edits survive
  - agents/
  - .github/

# Post-generation tasks
# Pass all variables as command-line arguments since extra_env isn't supported
_tasks:
  - >-
    python3 "{{ _copier_conf.src_path }}/scripts/post_gen.py"
    --project-name "{{ project_name }}"
    --repo-name "{{ repo_name }}"
    --env-name "{{ env_name }}"
    --module-name "{{ module_name }}"
    --author-name "{{ author_name }}"
    --description "{{ description }}"
    --python-version "{{ python_version_number }}"
    --dataset-storage "{{ dataset_storage }}"
    --s3-bucket "{{ s3_bucket | default('') }}"
    --s3-aws-profile "{{ s3_aws_profile | default('default') }}"
    --azure-container "{{ azure_container | default('') }}"
    --gcs-bucket "{{ gcs_bucket | default('') }}"
    --environment-manager "{{ environment_manager }}"
    --env-location "{{ env_location | default('local') }}"
    --dependency-file "{{ dependency_file }}"
    --pydata-packages "{{ pydata_packages }}"
    --testing-framework "{{ testing_framework }}"
    --linting-and-formatting "{{ linting_and_formatting }}"
    --open-source-license "{{ open_source_license }}"
    --docs "{{ docs }}"
    --include-code-scaffold "{{ include_code_scaffold }}"
    --jupyter-kernel-support "{{ jupyter_kernel_support }}"
    --env-encryption "{{ env_encryption }}"
    --docker-support "{{ docker_support }}"
    --docker-package-manager "{{ docker_package_manager | default('uv') }}"
    --package-repository "{{ package_repository }}"
    --package-repository-url "{{ package_repository_url | default('') }}"
    --custom-config "{{ custom_config }}"
    --git-init "{{ git_init }}"
    --copier-operation "{{ _copier_operation }}"
    --ai-assistant "{{ ai_assistant }}"
    --scaffold-agents "{{ scaffold_agents }}"
    --github-actions "{{ github_actions }}"

# Answers file for template updates
_answers_file: .copier-answers.yml
