<!--
  15-dev-prod-separation.svg
  Shows: pyproject.toml splits into dev (rich) and prod/Docker (lean) with forking arrows,
  Lucide icons, size comparison bars, Docker whale on prod side
  Intent: Visualize why dev/prod dependency separation matters
  Theme: Stellars-Tech EU

  === GRID ===
  viewBox: 0 0 800 430
  margins: left=15, right=15, top=10, bottom=10

  Title: y=22
  Source card: x=250 y=30 w=300 h=44
  Fork point: cx=400 cy=90
  Left arm tip: (200,120)    Right arm tip: (600,120)
  Dev container:  x=15  y=124 w=370 h=290  (bottom at 414)
  Prod container: x=415 y=124 w=370 h=290  (bottom at 414)

  Sub-cards inside dev container:
    shared-deps: x=28 y=164 w=344 h=90     (bottom at 254)
    dev-deps:    x=28 y=264 w=344 h=116    (bottom at 380)
    size-bar:    x=28 y=392 w=344 h=10

  Sub-cards inside prod container:
    prod-deps:   x=428 y=164 w=344 h=90    (bottom at 254)
    clean-zone:  x=428 y=264 w=344 h=116   (bottom at 380)
    size-bar:    x=428 y=392 w=160 h=10

  === LAYOUT TOPOLOGY ===
  flow: source -> fork-point -> [dev-container, prod-container]
  h-stack: dev-container, prod-container
  contain(dev): [shared-deps, dev-deps, size-bar]
  contain(prod): [prod-deps, clean-zone, size-bar]
  === END ===
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <style>
    .fg-1 { fill: #1a5a6e; }
    .fg-2 { fill: #24697e; }
    .fg-3 { fill: #236a74; }
    .fg-4 { fill: #2b7680; }
    .accent-1 { fill: #005f7a; }
    .accent-2 { fill: #7a4a15; }
    .status-yes { fill: #1a6e3a; }
    @media (prefers-color-scheme: dark) {
      .fg-1 { fill: #b8e4f0; }
      .fg-2 { fill: #8fd4e6; }
      .fg-3 { fill: #5aafc5; }
      .fg-4 { fill: #4099b3; }
      .accent-1 { fill: #5cc8e0; }
      .accent-2 { fill: #d4a04a; }
      .status-yes { fill: #44cc77; }
    }
  </style>

  <rect width="800" height="450" fill="transparent"/>

  <text x="400" y="18" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="1" class="fg-2">DEV/PROD DEPENDENCY SEPARATION</text>

  <!-- Source: pyproject.toml -->
  <g id="source">
    <path d="M250,30 H550 V71 Q550,74 547,74 H253 Q250,74 250,71 Z" fill="#005f7a" fill-opacity="0.08"/>
    <path d="M250,30 H550 V71 Q550,74 547,74 H253 Q250,74 250,71 Z" fill="none" stroke="#005f7a" stroke-width="1.2"/>
    <rect x="250" y="30" width="300" height="5" fill="#005f7a" opacity="0.7"/>
    <!-- Icon: file-code (Lucide, ISC license) -->
    <g transform="translate(260, 42) scale(0.583)" fill="none" stroke="#005f7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
      <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/>
      <path d="M14 2v5a1 1 0 0 0 1 1h5"/>
      <path d="M10 12.5 8 15l2 2.5"/><path d="m14 12.5 2 2.5-2 2.5"/>
    </g>
    <text x="400" y="52" font-family="Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" class="fg-1">pyproject.toml</text>
    <text x="400" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" class="fg-3">Single source of truth for all dependencies</text>
  </g>

  <!-- Fork: vertical stem, circle, two L-arms with chamfers -->
  <g id="fork-arrows">
    <line x1="400" y1="74" x2="400" y2="88" stroke="#005f7a" stroke-width="1.5" opacity="0.5"/>
    <circle cx="400" cy="88" r="3.5" fill="#005f7a" opacity="0.5"/>

    <!-- Left arm -->
    <line x1="397" y1="88" x2="204" y2="88" stroke="#005f7a" stroke-width="1.5" opacity="0.5"/>
    <line x1="204" y1="88" x2="200" y2="92" stroke="#005f7a" stroke-width="1.5" opacity="0.5"/>
    <line x1="200" y1="92" x2="200" y2="118" stroke="#005f7a" stroke-width="1.5" opacity="0.5"/>
    <polygon points="196,116 200,124 204,116" fill="#005f7a" opacity="0.7"/>

    <!-- Right arm -->
    <line x1="403" y1="88" x2="596" y2="88" stroke="#005f7a" stroke-width="1.5" opacity="0.5"/>
    <line x1="596" y1="88" x2="600" y2="92" stroke="#005f7a" stroke-width="1.5" opacity="0.5"/>
    <line x1="600" y1="92" x2="600" y2="118" stroke="#005f7a" stroke-width="1.5" opacity="0.5"/>
    <polygon points="596,116 600,124 604,116" fill="#005f7a" opacity="0.7"/>
  </g>

  <!-- Branch labels - above the horizontal arms, between source and fork -->
  <rect x="60" y="56" width="162" height="16" rx="4" fill="#005f7a" fill-opacity="0.08" stroke="#005f7a" stroke-width="0.5" opacity="0.3"/>
  <text x="141" y="68" font-family="Consolas, monospace" font-size="9" text-anchor="middle" class="accent-1">pip install -e ".[dev]"</text>
  <rect x="578" y="56" width="120" height="16" rx="4" fill="#005f7a" fill-opacity="0.08" stroke="#005f7a" stroke-width="0.5" opacity="0.3"/>
  <text x="638" y="68" font-family="Consolas, monospace" font-size="9" text-anchor="middle" class="accent-1">pip install .</text>

  <!-- ================================================ -->
  <!-- DEV CONTAINER                                    -->
  <!-- ================================================ -->
  <g id="dev-container">
    <path d="M15,124 H385 V427 Q385,430 382,430 H18 Q15,430 15,427 Z" fill="#005f7a" fill-opacity="0.04"/>
    <path d="M15,124 H385 V427 Q385,430 382,430 H18 Q15,430 15,427 Z" fill="none" stroke="#005f7a" stroke-width="1"/>
    <rect x="15" y="124" width="370" height="5" fill="#005f7a" opacity="0.6"/>

    <!-- Icon: monitor (Lucide, ISC license) -->
    <g transform="translate(30, 136) scale(0.667)" fill="none" stroke="#005f7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
      <rect width="20" height="14" x="2" y="3" rx="2"/>
      <line x1="8" x2="16" y1="21" y2="21"/>
      <line x1="12" x2="12" y1="17" y2="21"/>
    </g>
    <text x="55" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" class="accent-1">Development Environment</text>

    <!-- Shared deps sub-card -->
    <g id="dev-shared">
      <path d="M28,164 H372 V243 Q372,246 369,246 H31 Q28,246 28,243 Z" fill="#005f7a" fill-opacity="0.08"/>
      <path d="M28,164 H372 V243 Q372,246 369,246 H31 Q28,246 28,243 Z" fill="none" stroke="#005f7a" stroke-width="1" opacity="0.5"/>
      <rect x="28" y="164" width="344" height="5" fill="#005f7a" opacity="0.4"/>
      <!-- Icon: package (Lucide, ISC license) -->
      <g transform="translate(332, 176) scale(0.5)" fill="none" stroke="#005f7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
        <path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/>
        <path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/>
      </g>
      <text x="42" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" class="fg-1">[project.dependencies]</text>
      <text x="42" y="200" font-family="Consolas, monospace" font-size="10" class="fg-2">python-dotenv    loguru</text>
      <text x="42" y="216" font-family="Consolas, monospace" font-size="10" class="fg-2">tqdm             typer</text>
      <text x="42" y="232" font-family="Consolas, monospace" font-size="10" class="fg-3">botocore / azure-storage-blob / gcs</text>
    </g>

    <!-- Dev-only deps sub-card -->
    <g id="dev-only">
      <path d="M28,258 H372 V387 Q372,390 369,390 H31 Q28,390 28,387 Z" fill="#7a4a15" fill-opacity="0.08"/>
      <path d="M28,258 H372 V387 Q372,390 369,390 H31 Q28,390 28,387 Z" fill="none" stroke="#7a4a15" stroke-width="1" opacity="0.5"/>
      <rect x="28" y="258" width="344" height="5" fill="#7a4a15" opacity="0.4"/>
      <!-- Icon: wrench (Lucide, ISC license) -->
      <g transform="translate(332, 270) scale(0.5)" fill="none" stroke="#7a4a15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z"/>
      </g>
      <text x="42" y="276" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" class="fg-1">[project.optional-dependencies.dev]</text>
      <text x="42" y="296" font-family="Consolas, monospace" font-size="10" class="accent-2">pytest           pytest-cov</text>
      <text x="42" y="314" font-family="Consolas, monospace" font-size="10" class="accent-2">ruff</text>
      <text x="42" y="332" font-family="Consolas, monospace" font-size="10" class="accent-2">mkdocs           mkdocs-material</text>
      <text x="42" y="350" font-family="Consolas, monospace" font-size="10" class="accent-2">ipython          ipykernel</text>
      <text x="42" y="368" font-family="Consolas, monospace" font-size="10" class="accent-2">nbdime           twine</text>
      <text x="42" y="384" font-family="Segoe UI, Arial, sans-serif" font-size="8" class="fg-4">Dev tooling - never ships to production</text>
    </g>

    <!-- Size bar -->
    <rect x="28" y="400" width="344" height="10" rx="3" fill="#005f7a" fill-opacity="0.15"/>
    <rect x="28" y="400" width="344" height="10" rx="3" fill="#7a4a15" fill-opacity="0.10"/>
    <text x="200" y="423" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="middle" class="fg-3">Full dev environment</text>
  </g>

  <!-- ================================================ -->
  <!-- PROD CONTAINER                                   -->
  <!-- ================================================ -->
  <g id="prod-container">
    <path d="M415,124 H785 V427 Q785,430 782,430 H418 Q415,430 415,427 Z" fill="#005f7a" fill-opacity="0.04"/>
    <path d="M415,124 H785 V427 Q785,430 782,430 H418 Q415,430 415,427 Z" fill="none" stroke="#005f7a" stroke-width="1"/>
    <rect x="415" y="124" width="370" height="5" fill="#005f7a" opacity="0.6"/>

    <!-- Icon: container (Lucide, ISC license) -->
    <g transform="translate(430, 136) scale(0.667)" fill="none" stroke="#005f7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
      <path d="M22 7.7c0-.6-.4-1.2-.8-1.5l-6.3-3.9a1.72 1.72 0 0 0-1.7 0l-10.3 6c-.5.2-.9.8-.9 1.4v6.6c0 .5.4 1.2.8 1.5l6.3 3.9a1.72 1.72 0 0 0 1.7 0l10.3-6c.5-.3.9-1 .9-1.5Z"/>
      <path d="M10 21.9V14L2.1 9.1"/><path d="m10 14 11.9-6.9"/>
      <path d="M14 19.8v-8.1"/><path d="M18 17.5V9.4"/>
    </g>
    <text x="460" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" class="accent-1">Production / Docker Image</text>

    <!-- Prod deps sub-card (mirrors dev shared) -->
    <g id="prod-deps">
      <path d="M428,164 H772 V243 Q772,246 769,246 H431 Q428,246 428,243 Z" fill="#005f7a" fill-opacity="0.08"/>
      <path d="M428,164 H772 V243 Q772,246 769,246 H431 Q428,246 428,243 Z" fill="none" stroke="#005f7a" stroke-width="1" opacity="0.5"/>
      <rect x="428" y="164" width="344" height="5" fill="#005f7a" opacity="0.4"/>
      <g transform="translate(732, 176) scale(0.5)" fill="none" stroke="#005f7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
        <path d="M16.5 9.4-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
      </g>
      <text x="442" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" class="fg-1">[project.dependencies]</text>
      <text x="442" y="200" font-family="Consolas, monospace" font-size="10" class="fg-2">python-dotenv    loguru</text>
      <text x="442" y="216" font-family="Consolas, monospace" font-size="10" class="fg-2">tqdm             typer</text>
      <text x="442" y="232" font-family="Consolas, monospace" font-size="10" class="fg-3">botocore / azure-storage-blob / gcs</text>
    </g>

    <!-- Clean zone -->
    <g id="clean-zone">
      <path d="M428,258 H772 V387 Q772,390 769,390 H431 Q428,390 428,387 Z" fill="#1a6e3a" fill-opacity="0.06"/>
      <path d="M428,258 H772 V387 Q772,390 769,390 H431 Q428,390 428,387 Z" fill="none" stroke="#1a6e3a" stroke-width="1" opacity="0.4" stroke-dasharray="5,3"/>
      <rect x="428" y="258" width="344" height="5" fill="#1a6e3a" opacity="0.3"/>
      <!-- Icon: shield-check (Lucide, ISC license) -->
      <g transform="translate(442, 272) scale(0.583)" fill="none" stroke="#1a6e3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
        <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
        <path d="m9 12 2 2 4-4"/>
      </g>
      <text x="470" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" class="status-yes">Clean production image</text>
      <text x="442" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="10" class="fg-3">No pytest, no ruff, no mkdocs</text>
      <text x="442" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="10" class="fg-3">No ipython, no ipykernel, no nbdime</text>
      <text x="442" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="10" class="fg-3">No twine, no dev tooling at all</text>
      <text x="442" y="370" font-family="Consolas, monospace" font-size="9" class="status-yes">Installs from wheel (dist/*.whl)</text>
    </g>

    <!-- Size bar (same width, green tint = lean) -->
    <rect x="428" y="400" width="344" height="10" rx="3" fill="#1a6e3a" fill-opacity="0.12"/>
    <text x="600" y="423" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="middle" class="status-yes">Lean production image</text>
  </g>
</svg>
