<!--
  15-dev-prod-separation.svg
  Shows: pyproject.toml splits into dev (rich) and prod/Docker (lean) with proper forking arrows,
  Lucide icons per package category, size comparison bars, and a Docker whale accent on prod side
  Intent: Visualize why dev/prod dependency separation matters - Docker images ship clean
  Theme: Stellars-Tech EU

  === GRID ===
  viewBox: 0 0 800 400
  margins: left=15, right=15, top=10, bottom=10

  Title: y=22
  Source card: x=250 y=30 w=300 h=44
  Fork point: cx=400 cy=90
  Left arm: (400,90) -> (200,90) -> (200,110)   tip at (200,110)
  Right arm: (400,90) -> (600,90) -> (600,110)   tip at (600,110)
  Dev container: x=15  y=114 w=370 h=248
  Prod container: x=415 y=114 w=370 h=248
  Size bars: y=372, inside each container bottom

  === LAYOUT TOPOLOGY ===
  flow: source -> fork-point -> [dev-container, prod-container]
  h-stack: dev-container, prod-container
  contain(dev): [shared-deps, dev-deps, size-bar]
  contain(prod): [shared-deps, clean-zone, size-bar, docker-icon]
  === END ===
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <style>
    .fg-1 { fill: #1a5a6e; }
    .fg-2 { fill: #24697e; }
    .fg-3 { fill: #236a74; }
    .fg-4 { fill: #2b7680; }
    .accent-1 { fill: #005f7a; }
    .accent-2 { fill: #7a4a15; }
    .status-yes { fill: #1a6e3a; }
    @media (prefers-color-scheme: dark) {
      .fg-1 { fill: #b8e4f0; }
      .fg-2 { fill: #8fd4e6; }
      .fg-3 { fill: #5aafc5; }
      .fg-4 { fill: #4099b3; }
      .accent-1 { fill: #5cc8e0; }
      .accent-2 { fill: #d4a04a; }
      .status-yes { fill: #44cc77; }
    }
  </style>

  <rect width="800" height="400" fill="transparent"/>

  <text x="400" y="18" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="1" class="fg-2">DEV/PROD DEPENDENCY SEPARATION</text>

  <!-- Source: pyproject.toml -->
  <g id="source">
    <path d="M250,30 H550 V71 Q550,74 547,74 H253 Q250,74 250,71 Z" fill="#005f7a" fill-opacity="0.06"/>
    <path d="M250,30 H550 V71 Q550,74 547,74 H253 Q250,74 250,71 Z" fill="none" stroke="#005f7a" stroke-width="1.2"/>
    <rect x="250" y="30" width="300" height="5" fill="#005f7a" opacity="0.7"/>
    <!-- Icon: file-code (Lucide, ISC license) -->
    <g transform="translate(260, 42) scale(0.583)" fill="none" stroke="#005f7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
      <path d="M10 12.5 8 15l2 2.5"/><path d="m14 12.5 2 2.5-2 2.5"/>
      <path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/>
    </g>
    <text x="400" y="52" font-family="Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" class="fg-1">pyproject.toml</text>
    <text x="400" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" class="fg-4">Single source of truth for all dependencies</text>
  </g>

  <!-- Fork stem: vertical from source bottom to fork point -->
  <line x1="400" y1="74" x2="400" y2="88" stroke="#005f7a" stroke-width="1.5" opacity="0.4"/>
  <!-- Fork circle -->
  <circle cx="400" cy="88" r="3" fill="#005f7a" opacity="0.4"/>

  <!-- Left arm: horizontal then vertical with chamfer -->
  <line x1="400" y1="88" x2="204" y2="88" stroke="#005f7a" stroke-width="1.5" opacity="0.4"/>
  <line x1="200" y1="92" x2="200" y2="114" stroke="#005f7a" stroke-width="1.5" opacity="0.4"/>
  <!-- Chamfer at bend -->
  <line x1="204" y1="88" x2="200" y2="92" stroke="#005f7a" stroke-width="1.5" opacity="0.4"/>
  <!-- Arrowhead -->
  <polygon points="197,110 200,118 203,110" fill="#005f7a" opacity="0.6"/>

  <!-- Right arm: horizontal then vertical with chamfer -->
  <line x1="400" y1="88" x2="596" y2="88" stroke="#005f7a" stroke-width="1.5" opacity="0.4"/>
  <line x1="600" y1="92" x2="600" y2="114" stroke="#005f7a" stroke-width="1.5" opacity="0.4"/>
  <!-- Chamfer at bend -->
  <line x1="596" y1="88" x2="600" y2="92" stroke="#005f7a" stroke-width="1.5" opacity="0.4"/>
  <!-- Arrowhead -->
  <polygon points="597,110 600,118 603,110" fill="#005f7a" opacity="0.6"/>

  <!-- Branch labels on arms -->
  <rect x="100" y="78" width="155" height="16" rx="3" fill="#005f7a" fill-opacity="0.06"/>
  <text x="177" y="90" font-family="Consolas, monospace" font-size="9" text-anchor="middle" class="accent-1">pip install -e ".[dev]"</text>
  <rect x="530" y="78" width="115" height="16" rx="3" fill="#005f7a" fill-opacity="0.06"/>
  <text x="587" y="90" font-family="Consolas, monospace" font-size="9" text-anchor="middle" class="accent-1">pip install .</text>

  <!-- ============================================ -->
  <!-- DEV CONTAINER                                -->
  <!-- ============================================ -->
  <g id="dev-container">
    <path d="M15,118 H385 V382 Q385,385 382,385 H18 Q15,385 15,382 Z" fill="#005f7a" fill-opacity="0.03"/>
    <path d="M15,118 H385 V382 Q385,385 382,385 H18 Q15,385 15,382 Z" fill="none" stroke="#005f7a" stroke-width="1"/>
    <rect x="15" y="118" width="370" height="5" fill="#005f7a" opacity="0.6"/>

    <!-- Icon: monitor (Lucide, ISC license) -->
    <g transform="translate(33, 132) scale(0.583)" fill="none" stroke="#005f7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4">
      <rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
    </g>
    <text x="55" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" class="accent-1">Development Environment</text>

    <!-- Shared deps (production) sub-card -->
    <g id="dev-shared">
      <path d="M25,158 H375 V236 Q375,239 372,239 H28 Q25,239 25,236 Z" fill="#005f7a" fill-opacity="0.02"/>
      <path d="M25,158 H375 V236 Q375,239 372,239 H28 Q25,239 25,236 Z" fill="none" stroke="#005f7a" stroke-width="0.8" opacity="0.25"/>
      <rect x="25" y="158" width="350" height="4" fill="#005f7a" opacity="0.15"/>
      <text x="35" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" class="fg-2">[project.dependencies]</text>
      <!-- Icon: package (Lucide) -->
      <g transform="translate(335, 165) scale(0.5)" fill="none" stroke="#005f7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.3">
        <path d="M16.5 9.4-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
      </g>
      <text x="45" y="194" font-family="Consolas, monospace" font-size="10" class="fg-3">python-dotenv    loguru</text>
      <text x="45" y="210" font-family="Consolas, monospace" font-size="10" class="fg-3">tqdm             typer</text>
      <text x="45" y="228" font-family="Consolas, monospace" font-size="10" class="fg-4">botocore / azure-storage-blob / gcs</text>
    </g>

    <!-- Dev-only deps sub-card -->
    <g id="dev-only">
      <path d="M25,248 H375 V360 Q375,363 372,363 H28 Q25,363 25,360 Z" fill="#7a4a15" fill-opacity="0.03"/>
      <path d="M25,248 H375 V360 Q375,363 372,363 H28 Q25,363 25,360 Z" fill="none" stroke="#7a4a15" stroke-width="0.8" opacity="0.25"/>
      <rect x="25" y="248" width="350" height="4" fill="#7a4a15" opacity="0.15"/>
      <text x="35" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" class="accent-2">[project.optional-dependencies.dev]</text>
      <!-- Icon: wrench (Lucide) -->
      <g transform="translate(335, 255) scale(0.5)" fill="none" stroke="#7a4a15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.3">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </g>
      <text x="45" y="284" font-family="Consolas, monospace" font-size="10" class="accent-2">pytest           pytest-cov</text>
      <text x="45" y="300" font-family="Consolas, monospace" font-size="10" class="accent-2">ruff</text>
      <text x="45" y="316" font-family="Consolas, monospace" font-size="10" class="accent-2">mkdocs           mkdocs-material</text>
      <text x="45" y="332" font-family="Consolas, monospace" font-size="10" class="accent-2">ipython          ipykernel</text>
      <text x="45" y="348" font-family="Consolas, monospace" font-size="10" class="accent-2">nbdime           twine</text>
    </g>

    <!-- Size bar -->
    <rect x="25" y="372" width="350" height="8" rx="2" fill="#005f7a" fill-opacity="0.12"/>
    <rect x="25" y="372" width="350" height="8" rx="2" fill="#7a4a15" fill-opacity="0.08"/>
    <text x="200" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" class="fg-4">Full dev environment</text>
  </g>

  <!-- ============================================ -->
  <!-- PROD CONTAINER                               -->
  <!-- ============================================ -->
  <g id="prod-container">
    <path d="M415,118 H785 V382 Q785,385 782,385 H418 Q415,385 415,382 Z" fill="#005f7a" fill-opacity="0.03"/>
    <path d="M415,118 H785 V382 Q785,385 782,385 H418 Q415,385 415,382 Z" fill="none" stroke="#005f7a" stroke-width="1"/>
    <rect x="415" y="118" width="370" height="5" fill="#005f7a" opacity="0.6"/>

    <!-- Docker whale icon (simplified, hand-drawn) -->
    <g transform="translate(730, 126) scale(0.7)" fill="none" stroke="#005f7a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.3">
      <path d="M3 18h1.5c1 0 1.5-.5 2-1.5C8 13 11 12 14 12h2c1 0 2-.5 2-1.5 0-2-2.5-3-4-3h-1c-.5 0-1 .5-1 1v1H8V7.5C8 7 7.5 6.5 7 6.5H5"/>
      <rect x="4" y="8" width="2" height="2"/><rect x="7" y="8" width="2" height="2"/><rect x="10" y="8" width="2" height="2"/>
      <rect x="7" y="5.5" width="2" height="2"/><rect x="10" y="5.5" width="2" height="2"/>
    </g>
    <text x="462" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" class="accent-1">Production / Docker Image</text>

    <!-- Only production deps sub-card -->
    <g id="prod-deps">
      <path d="M425,158 H775 V236 Q775,239 772,239 H428 Q425,239 425,236 Z" fill="#005f7a" fill-opacity="0.02"/>
      <path d="M425,158 H775 V236 Q775,239 772,239 H428 Q425,239 425,236 Z" fill="none" stroke="#005f7a" stroke-width="0.8" opacity="0.25"/>
      <rect x="425" y="158" width="350" height="4" fill="#005f7a" opacity="0.15"/>
      <text x="435" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" class="fg-2">[project.dependencies]</text>
      <g transform="translate(735, 165) scale(0.5)" fill="none" stroke="#005f7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.3">
        <path d="M16.5 9.4-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
      </g>
      <text x="445" y="194" font-family="Consolas, monospace" font-size="10" class="fg-3">python-dotenv    loguru</text>
      <text x="445" y="210" font-family="Consolas, monospace" font-size="10" class="fg-3">tqdm             typer</text>
      <text x="445" y="228" font-family="Consolas, monospace" font-size="10" class="fg-4">botocore / azure-storage-blob / gcs</text>
    </g>

    <!-- Clean zone - what's NOT shipped -->
    <g id="clean-zone">
      <path d="M425,248 H775 V360 Q775,363 772,363 H428 Q425,363 425,360 Z" fill="#1a6e3a" fill-opacity="0.02"/>
      <path d="M425,248 H775 V360 Q775,363 772,363 H428 Q425,363 425,360 Z" fill="none" stroke="#1a6e3a" stroke-width="0.8" opacity="0.2" stroke-dasharray="4,3"/>
      <!-- Icon: shield-check (Lucide) -->
      <g transform="translate(580, 262) scale(0.75)" fill="none" stroke="#1a6e3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.3">
        <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
        <path d="m9 12 2 2 4-4"/>
      </g>
      <text x="600" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" class="status-yes">Clean production image</text>
      <text x="600" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-4">No pytest, no ruff, no mkdocs</text>
      <text x="600" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-4">No ipython, no ipykernel, no nbdime</text>
      <text x="600" y="334" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-4">No twine, no dev tooling</text>
      <text x="600" y="354" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" class="status-yes">Installs from wheel, not source</text>
    </g>

    <!-- Size bar (shorter = smaller) -->
    <rect x="425" y="372" width="160" height="8" rx="2" fill="#005f7a" fill-opacity="0.12"/>
    <text x="600" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" class="status-yes">Lean production image</text>
  </g>
</svg>
