<!--
  18-copier-concept.svg
  Shows: The Copier concept as a "living blueprint" - a central template emitting versioned
  pulses along glowing pathways to three connected projects. Each project has a small
  .copier-answers.yml "memory chip" that maintains the bond. One project shows the update
  pulse arriving, another shows it already applied, the third is still on the old version.
  Pathway pulses are animated-style dashed lines suggesting flow.
  Intent: Make the abstract concept of "living templates" tangible and beautiful
  Theme: Stellars-Tech EU

  === GRID ===
  viewBox: 0 0 800 400
  margins: left=20, right=20, top=10, bottom=10

  Title: y=24
  Template source: cx=400 cy=110, large hexagonal shape w=180 h=100
  Three project nodes on a lower arc:
    project-a: cx=130 cy=320  (v1.0 - outdated)
    project-b: cx=400 cy=340  (v1.2 - update arriving)
    project-c: cx=670 cy=320  (v1.2 - current)

  Pathways: curved lines from template to each project
  Pulse dots: small circles on pathways suggesting data flow
  Memory chips: small rounded rects below each project showing .copier-answers.yml

  === LAYOUT TOPOLOGY ===
  flow: template-source -> [project-a, project-b, project-c]
  pathway: curved bezier from template bottom to each project top
  === END ===
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <style>
    .fg-1 { fill: #1a5a6e; }
    .fg-2 { fill: #24697e; }
    .fg-3 { fill: #236a74; }
    .fg-4 { fill: #2b7680; }
    .accent-1 { fill: #005f7a; }
    .accent-2 { fill: #7a4a15; }
    .status-yes { fill: #1a6e3a; }
    .status-no { fill: #6e1a1a; }
    @media (prefers-color-scheme: dark) {
      .fg-1 { fill: #b8e4f0; }
      .fg-2 { fill: #8fd4e6; }
      .fg-3 { fill: #5aafc5; }
      .fg-4 { fill: #4099b3; }
      .accent-1 { fill: #5cc8e0; }
      .accent-2 { fill: #d4a04a; }
      .status-yes { fill: #44cc77; }
      .status-no { fill: #e05555; }
    }
  </style>

  <rect width="800" height="400" fill="transparent"/>

  <text x="400" y="20" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="1" class="fg-2">HOW COPIER WORKS: LIVING CONNECTION BETWEEN TEMPLATE AND PROJECTS</text>

  <!-- ============================== -->
  <!-- TEMPLATE SOURCE (hexagon-ish)  -->
  <!-- ============================== -->
  <g id="template-source">
    <!-- Outer glow ring -->
    <ellipse cx="400" cy="100" rx="108" ry="58" fill="#005f7a" fill-opacity="0.03" stroke="#005f7a" stroke-width="0.5" opacity="0.2"/>

    <!-- Hexagonal shape -->
    <polygon points="310,100 340,60 460,60 490,100 460,140 340,140" fill="#005f7a" fill-opacity="0.08"/>
    <polygon points="310,100 340,60 460,60 490,100 460,140 340,140" fill="none" stroke="#005f7a" stroke-width="1.5"/>

    <!-- Icon: git-branch (Lucide, ISC license) -->
    <g transform="translate(358, 72) scale(0.667)" fill="none" stroke="#005f7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
      <line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="6" r="3"/>
      <path d="M18 9a9 9 0 0 1-9 9"/>
    </g>
    <text x="400" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" class="fg-1">Template Repository</text>
    <text x="400" y="108" font-family="Consolas, monospace" font-size="10" text-anchor="middle" class="fg-3">gh:author/template</text>
    <text x="400" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" class="fg-4">Evolves with new features and fixes</text>

    <!-- Version tags floating around hexagon -->
    <g id="version-tags">
      <rect x="495" y="62" width="38" height="14" rx="3" fill="#005f7a" fill-opacity="0.08" stroke="#005f7a" stroke-width="0.5" opacity="0.4"/>
      <text x="514" y="73" font-family="Consolas, monospace" font-size="8" text-anchor="middle" class="fg-4">v1.0</text>
      <rect x="500" y="84" width="38" height="14" rx="3" fill="#005f7a" fill-opacity="0.08" stroke="#005f7a" stroke-width="0.5" opacity="0.5"/>
      <text x="519" y="95" font-family="Consolas, monospace" font-size="8" text-anchor="middle" class="fg-3">v1.1</text>
      <rect x="497" y="106" width="38" height="14" rx="3" fill="#005f7a" fill-opacity="0.12" stroke="#005f7a" stroke-width="0.8" opacity="0.7"/>
      <text x="516" y="117" font-family="Consolas, monospace" font-size="8" font-weight="600" text-anchor="middle" class="fg-2">v1.2</text>
    </g>
  </g>

  <!-- ============================== -->
  <!-- PATHWAYS (curved beziers)      -->
  <!-- ============================== -->
  <g id="pathways">
    <!-- Path to Project A (left) - faded, old connection -->
    <path d="M340,140 C300,200 180,240 130,275" fill="none" stroke="#7a4a15" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.2"/>
    <!-- Dormant dots -->
    <circle cx="280" cy="185" r="2.5" fill="#7a4a15" opacity="0.15"/>
    <circle cx="220" cy="225" r="2.5" fill="#7a4a15" opacity="0.12"/>

    <!-- Path to Project B (center) - active, pulse traveling -->
    <path d="M400,140 C400,200 400,240 400,275" fill="none" stroke="#005f7a" stroke-width="2" stroke-dasharray="6,4" opacity="0.4"/>
    <!-- Active pulse dots traveling down -->
    <circle cx="400" cy="170" r="3.5" fill="#005f7a" opacity="0.6"/>
    <circle cx="400" cy="195" r="3" fill="#005f7a" opacity="0.45"/>
    <circle cx="400" cy="218" r="2.5" fill="#005f7a" opacity="0.3"/>
    <circle cx="400" cy="240" r="2" fill="#005f7a" opacity="0.2"/>
    <!-- Update label on pathway -->
    <rect x="408" y="196" width="90" height="16" rx="4" fill="#005f7a" fill-opacity="0.08" stroke="#005f7a" stroke-width="0.5" opacity="0.5"/>
    <text x="453" y="208" font-family="Consolas, monospace" font-size="8" text-anchor="middle" class="accent-1">copier update</text>

    <!-- Path to Project C (right) - solid, up to date -->
    <path d="M460,140 C500,200 620,240 670,275" fill="none" stroke="#1a6e3a" stroke-width="1.5" opacity="0.3"/>
    <!-- Stable connection dots -->
    <circle cx="520" cy="190" r="2.5" fill="#1a6e3a" opacity="0.25"/>
    <circle cx="580" cy="225" r="2.5" fill="#1a6e3a" opacity="0.2"/>
  </g>

  <!-- ============================== -->
  <!-- PROJECT A (outdated, v1.0)     -->
  <!-- ============================== -->
  <g id="project-a">
    <path d="M40,278 H220 V355 Q220,358 217,358 H43 Q40,358 40,355 Z" fill="#7a4a15" fill-opacity="0.05"/>
    <path d="M40,278 H220 V355 Q220,358 217,358 H43 Q40,358 40,355 Z" fill="none" stroke="#7a4a15" stroke-width="1" opacity="0.5"/>
    <rect x="40" y="278" width="180" height="5" fill="#7a4a15" opacity="0.4"/>
    <!-- Icon: folder (Lucide, ISC license) -->
    <g transform="translate(50, 292) scale(0.5)" fill="none" stroke="#7a4a15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
      <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
    </g>
    <text x="68" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" class="fg-2">project-alpha/</text>
    <text x="55" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="9" class="fg-4">Created 6 months ago</text>
    <text x="55" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="9" class="status-no">Still on v1.0</text>
    <!-- Memory chip -->
    <rect x="155" y="340" width="58" height="14" rx="2" fill="#7a4a15" fill-opacity="0.06" stroke="#7a4a15" stroke-width="0.5" opacity="0.4"/>
    <text x="184" y="350" font-family="Consolas, monospace" font-size="6" text-anchor="middle" class="fg-4">_commit: v1.0</text>
    <!-- Status -->
    <text x="130" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" class="status-no">outdated</text>
  </g>

  <!-- ============================== -->
  <!-- PROJECT B (updating, v1.1->1.2)-->
  <!-- ============================== -->
  <g id="project-b">
    <path d="M310,278 H490 V355 Q490,358 487,358 H313 Q310,358 310,355 Z" fill="#005f7a" fill-opacity="0.06"/>
    <path d="M310,278 H490 V355 Q490,358 487,358 H313 Q310,358 310,355 Z" fill="none" stroke="#005f7a" stroke-width="1.2"/>
    <rect x="310" y="278" width="180" height="5" fill="#005f7a" opacity="0.6"/>
    <!-- Icon: folder (Lucide, ISC license) -->
    <g transform="translate(320, 292) scale(0.5)" fill="none" stroke="#005f7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
      <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
    </g>
    <text x="338" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" class="fg-1">project-beta/</text>
    <text x="325" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="9" class="fg-3">Running copier update...</text>
    <text x="325" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="9" class="accent-1">Merging v1.1 -> v1.2</text>
    <!-- Memory chip (updating) -->
    <rect x="420" y="340" width="62" height="14" rx="2" fill="#005f7a" fill-opacity="0.08" stroke="#005f7a" stroke-width="0.8" opacity="0.6"/>
    <text x="451" y="350" font-family="Consolas, monospace" font-size="6" text-anchor="middle" class="accent-1">_commit: v1.2</text>
    <!-- Status -->
    <text x="400" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" class="accent-1">updating</text>
  </g>

  <!-- ============================== -->
  <!-- PROJECT C (current, v1.2)      -->
  <!-- ============================== -->
  <g id="project-c">
    <path d="M580,278 H760 V355 Q760,358 757,358 H583 Q580,358 580,355 Z" fill="#1a6e3a" fill-opacity="0.05"/>
    <path d="M580,278 H760 V355 Q760,358 757,358 H583 Q580,358 580,355 Z" fill="none" stroke="#1a6e3a" stroke-width="1"/>
    <rect x="580" y="278" width="180" height="5" fill="#1a6e3a" opacity="0.5"/>
    <!-- Icon: folder (Lucide, ISC license) -->
    <g transform="translate(590, 292) scale(0.5)" fill="none" stroke="#1a6e3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
      <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
    </g>
    <text x="608" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" class="fg-1">project-gamma/</text>
    <text x="595" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="9" class="fg-3">Updated last week</text>
    <text x="595" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="9" class="status-yes">Current at v1.2</text>
    <!-- Memory chip (current) -->
    <rect x="695" y="340" width="58" height="14" rx="2" fill="#1a6e3a" fill-opacity="0.08" stroke="#1a6e3a" stroke-width="0.5" opacity="0.5"/>
    <text x="724" y="350" font-family="Consolas, monospace" font-size="6" text-anchor="middle" class="status-yes">_commit: v1.2</text>
    <!-- Status -->
    <text x="670" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" class="status-yes">up to date</text>
  </g>

  <!-- ============================== -->
  <!-- LEGEND                          -->
  <!-- ============================== -->
  <g id="legend">
    <text x="400" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" class="fg-4">.copier-answers.yml remembers the template, the version, and your choices - enabling updates across all projects</text>
  </g>
</svg>
