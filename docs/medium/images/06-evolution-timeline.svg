<!--
  06-evolution-timeline.svg
  Shows: Horizontal timeline with 5 milestones showing evolution from upstream ccds to copier-only
  Intent: Visualize the project's journey and key decision points
  Theme: Stellars-Tech EU (teal/cyan primary, orange accent)

  === GRID ===
  viewBox: 0 0 800 170
  margins: left=30, right=30, top=10, bottom=10

  Track line: y=75, x1=60 to x2=740, stroke accent-1 opacity 0.3
  Track cutouts: cx-20 to cx+20 around each milestone circle
  Milestone circles: r=16, cy=75, cx at 100, 260, 420, 580, 700
  Date labels: y=30, above circles, fg-2 font-weight 700
  Description labels: y=110 and y=124, below circles, fg-3 and fg-4
  Progress arrows: small triangles between milestones on track

  === LAYOUT TOPOLOGY ===
  flow: milestone-1 -> milestone-2 -> milestone-3 -> milestone-4 -> milestone-5
  track: horizontal line with cutouts at each milestone
  === END ===
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170">
  <style>
    .fg-1 { fill: #1a5a6e; }
    .fg-2 { fill: #24697e; }
    .fg-3 { fill: #236a74; }
    .fg-4 { fill: #2b7680; }
    .accent-1 { fill: #005f7a; }
    .accent-2 { fill: #7a4a15; }
    @media (prefers-color-scheme: dark) {
      .fg-1 { fill: #b8e4f0; }
      .fg-2 { fill: #8fd4e6; }
      .fg-3 { fill: #5aafc5; }
      .fg-4 { fill: #4099b3; }
      .accent-1 { fill: #5cc8e0; }
      .accent-2 { fill: #d4a04a; }
    }
  </style>

  <rect width="800" height="170" fill="transparent"/>

  <!-- Title -->
  <text x="400" y="14" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="1" class="fg-2">PROJECT EVOLUTION</text>

  <!-- Track line with cutouts around milestone circles (r=16, gap=20 each side) -->
  <g id="track">
    <line x1="60" y1="75" x2="80" y2="75" stroke="#005f7a" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <line x1="120" y1="75" x2="240" y2="75" stroke="#005f7a" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <line x1="280" y1="75" x2="400" y2="75" stroke="#005f7a" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <line x1="440" y1="75" x2="560" y2="75" stroke="#005f7a" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <line x1="620" y1="75" x2="680" y2="75" stroke="#005f7a" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <line x1="720" y1="75" x2="740" y2="75" stroke="#005f7a" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- Progress arrows on track -->
  <g id="track-arrows">
    <polygon points="180,75 172,71 172,79" fill="#005f7a" opacity="0.4"/>
    <polygon points="340,75 332,71 332,79" fill="#005f7a" opacity="0.4"/>
    <polygon points="500,75 492,71 492,79" fill="#005f7a" opacity="0.4"/>
    <polygon points="650,75 642,71 642,79" fill="#005f7a" opacity="0.4"/>
  </g>

  <!-- Milestone 1: Upstream Fork -->
  <g id="milestone-1">
    <circle cx="100" cy="75" r="16" fill="#005f7a" fill-opacity="0.06" stroke="#005f7a" stroke-width="2"/>
    <!-- Icon: git-fork (Lucide, ISC license) -->
    <g transform="translate(92, 67) scale(0.667)" fill="none" stroke="#005f7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/>
      <path d="M18 9v2c0 .6-.4 1-1 1H7c-.6 0-1-.4-1-1V9"/><path d="M12 12v3"/>
    </g>
    <text x="100" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" class="fg-2">Nov 2025</text>
    <text x="100" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-3">Fork upstream</text>
    <text x="100" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" class="fg-4">uv default, lib_ prefix</text>
  </g>

  <!-- Milestone 2: Copier Integration -->
  <g id="milestone-2">
    <circle cx="260" cy="75" r="16" fill="#005f7a" fill-opacity="0.06" stroke="#005f7a" stroke-width="2"/>
    <!-- Icon: layers (Lucide, ISC license) -->
    <g transform="translate(252, 67) scale(0.667)" fill="none" stroke="#005f7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/>
      <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>
    </g>
    <text x="260" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" class="fg-2">Dec 2025</text>
    <text x="260" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-3">Copier integration</text>
    <text x="260" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" class="fg-4">Dual template phase</text>
  </g>

  <!-- Milestone 3: Copier-Only Migration -->
  <g id="milestone-3">
    <circle cx="420" cy="75" r="16" fill="#7a4a15" fill-opacity="0.06" stroke="#7a4a15" stroke-width="2"/>
    <!-- Icon: rocket (Lucide, ISC license) -->
    <g transform="translate(412, 67) scale(0.667)" fill="none" stroke="#7a4a15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
      <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
      <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
    </g>
    <text x="420" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" class="accent-2">Dec 2025</text>
    <text x="420" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-3">Copier-only migration</text>
    <text x="420" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" class="fg-4">Drop cookiecutter</text>
  </g>

  <!-- Milestone 4: v1.2 Update Fix -->
  <g id="milestone-4">
    <circle cx="580" cy="75" r="16" fill="#005f7a" fill-opacity="0.06" stroke="#005f7a" stroke-width="2"/>
    <!-- Icon: shield-check (Lucide, ISC license) -->
    <g transform="translate(572, 67) scale(0.667)" fill="none" stroke="#005f7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
      <path d="m9 12 2 2 4-4"/>
    </g>
    <text x="580" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" class="fg-2">Jan 2026</text>
    <text x="580" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-3">v1.2 clean updates</text>
    <text x="580" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" class="fg-4">Conflict resolution</text>
  </g>

  <!-- Milestone 5: Docker + Encryption -->
  <g id="milestone-5">
    <circle cx="700" cy="75" r="16" fill="#005f7a" fill-opacity="0.06" stroke="#005f7a" stroke-width="2"/>
    <!-- Icon: container (Lucide, ISC license) -->
    <g transform="translate(692, 67) scale(0.667)" fill="none" stroke="#005f7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="6" width="20" height="12" rx="2"/><path d="M12 12h.01"/>
      <path d="M17 6V4a2 2 0 0 0-2-2H9a2 2 0 0 0-2 2v2"/><path d="M2 12h20"/>
    </g>
    <text x="700" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" class="fg-2">Mar 2026</text>
    <text x="700" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-3">Docker + encryption</text>
    <text x="700" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" class="fg-4">Production-ready</text>
  </g>

  <!-- Legend -->
  <g id="legend">
    <circle cx="300" cy="155" r="5" fill="#7a4a15" fill-opacity="0.06" stroke="#7a4a15" stroke-width="1.5"/>
    <text x="312" y="159" font-family="Segoe UI, Arial, sans-serif" font-size="9" class="accent-2">Breaking change</text>
    <circle cx="430" cy="155" r="5" fill="#005f7a" fill-opacity="0.06" stroke="#005f7a" stroke-width="1.5"/>
    <text x="442" y="159" font-family="Segoe UI, Arial, sans-serif" font-size="9" class="accent-1">Enhancement</text>
  </g>
</svg>
