<!--
  19f-shared-language.svg
  Shows: Map-like diagram. Top: isolated islands (projects) with different flags and no bridges.
  Bottom: connected archipelago with bridges, same flag, shared infrastructure.
  Intent: Visualize how templates create a shared language across an organization
  Theme: Stellars-Tech EU

  === GRID ===
  viewBox: 0 0 800 400
  margins: left=20, right=20, top=10, bottom=10

  Title: y=22
  Top label: y=40 "Without a standard"
  Islands row: y=55, 5 islands as rounded shapes with different tool labels
  Divider: y=195
  Bottom label: y=215 "With a standard template"
  Connected row: y=230, 5 islands connected by bridge lines, same labels

  === LAYOUT TOPOLOGY ===
  v-stack: isolated-row, divider, connected-row
  h-stack(each row): island-1..island-5
  === END ===
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <style>
    .fg-1 { fill: #1a5a6e; }
    .fg-2 { fill: #24697e; }
    .fg-3 { fill: #236a74; }
    .fg-4 { fill: #2b7680; }
    .accent-1 { fill: #005f7a; }
    .accent-2 { fill: #7a4a15; }
    .status-yes { fill: #1a6e3a; }
    @media (prefers-color-scheme: dark) {
      .fg-1 { fill: #b8e4f0; }
      .fg-2 { fill: #8fd4e6; }
      .fg-3 { fill: #5aafc5; }
      .fg-4 { fill: #4099b3; }
      .accent-1 { fill: #5cc8e0; }
      .accent-2 { fill: #d4a04a; }
      .status-yes { fill: #44cc77; }
    }
  </style>

  <rect width="800" height="400" fill="transparent"/>

  <text x="400" y="20" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="1" class="fg-2">THE SHARED LANGUAGE</text>

  <!-- ================================ -->
  <!-- TOP: Isolated islands            -->
  <!-- ================================ -->

  <text x="400" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" class="accent-2">Without a standard - every project is its own island</text>

  <!-- Water/background hint -->
  <rect x="20" y="52" width="760" height="130" rx="6" fill="#7a4a15" fill-opacity="0.02" stroke="#7a4a15" stroke-width="0.5" opacity="0.15"/>

  <!-- Island 1 -->
  <g id="island-1" transform="rotate(-2 90 105)">
    <ellipse cx="90" cy="105" rx="60" ry="35" fill="#7a4a15" fill-opacity="0.06" stroke="#7a4a15" stroke-width="1" opacity="0.5"/>
    <text x="90" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="middle" class="fg-2">Project A</text>
    <text x="90" y="112" font-family="Consolas, monospace" font-size="7" text-anchor="middle" class="accent-2">pip + venvwrapper</text>
    <text x="90" y="124" font-family="Consolas, monospace" font-size="7" text-anchor="middle" class="fg-4">requirements.txt</text>
  </g>

  <!-- Island 2 -->
  <g id="island-2" transform="rotate(1.5 240 95)">
    <ellipse cx="240" cy="95" rx="60" ry="35" fill="#7a4a15" fill-opacity="0.06" stroke="#7a4a15" stroke-width="1" opacity="0.5"/>
    <text x="240" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="middle" class="fg-2">Project B</text>
    <text x="240" y="102" font-family="Consolas, monospace" font-size="7" text-anchor="middle" class="accent-2">conda global</text>
    <text x="240" y="114" font-family="Consolas, monospace" font-size="7" text-anchor="middle" class="fg-4">environment.yml</text>
  </g>

  <!-- Island 3 -->
  <g id="island-3" transform="rotate(-1 400 110)">
    <ellipse cx="400" cy="110" rx="60" ry="35" fill="#7a4a15" fill-opacity="0.06" stroke="#7a4a15" stroke-width="1" opacity="0.5"/>
    <text x="400" y="103" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="middle" class="fg-2">Project C</text>
    <text x="400" y="117" font-family="Consolas, monospace" font-size="7" text-anchor="middle" class="accent-2">poetry + Pipfile</text>
    <text x="400" y="129" font-family="Consolas, monospace" font-size="7" text-anchor="middle" class="fg-4">pyproject.toml</text>
  </g>

  <!-- Island 4 -->
  <g id="island-4" transform="rotate(2 560 98)">
    <ellipse cx="560" cy="98" rx="60" ry="35" fill="#7a4a15" fill-opacity="0.06" stroke="#7a4a15" stroke-width="1" opacity="0.5"/>
    <text x="560" y="91" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="middle" class="fg-2">Project D</text>
    <text x="560" y="105" font-family="Consolas, monospace" font-size="7" text-anchor="middle" class="accent-2">pixi</text>
    <text x="560" y="117" font-family="Consolas, monospace" font-size="7" text-anchor="middle" class="fg-4">pixi.toml</text>
  </g>

  <!-- Island 5 -->
  <g id="island-5" transform="rotate(-1.5 710 108)">
    <ellipse cx="710" cy="108" rx="60" ry="35" fill="#7a4a15" fill-opacity="0.06" stroke="#7a4a15" stroke-width="1" opacity="0.5"/>
    <text x="710" y="101" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="middle" class="fg-2">Project E</text>
    <text x="710" y="115" font-family="Consolas, monospace" font-size="7" text-anchor="middle" class="accent-2">uv + custom scripts</text>
    <text x="710" y="127" font-family="Consolas, monospace" font-size="7" text-anchor="middle" class="fg-4">setup.py</text>
  </g>

  <!-- Isolation indicators: question marks between islands -->
  <text x="165" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" class="fg-4" opacity="0.3">?</text>
  <text x="320" y="95" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" class="fg-4" opacity="0.3">?</text>
  <text x="480" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" class="fg-4" opacity="0.3">?</text>
  <text x="635" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" class="fg-4" opacity="0.3">?</text>

  <!-- ================================ -->
  <!-- DIVIDER                          -->
  <!-- ================================ -->

  <line x1="100" y1="195" x2="700" y2="195" stroke="#005f7a" stroke-width="0.5" opacity="0.15"/>
  <polygon points="396,188 400,195 404,188" fill="#005f7a" opacity="0.4"/>

  <!-- ================================ -->
  <!-- BOTTOM: Connected archipelago    -->
  <!-- ================================ -->

  <text x="400" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" class="accent-1">With a standard template - one shared language</text>

  <!-- Connected water/background -->
  <rect x="20" y="225" width="760" height="130" rx="6" fill="#005f7a" fill-opacity="0.02" stroke="#005f7a" stroke-width="0.5" opacity="0.15"/>

  <!-- Bridge lines connecting all islands -->
  <g id="bridges">
    <line x1="150" y1="280" x2="180" y2="280" stroke="#005f7a" stroke-width="2" opacity="0.25"/>
    <line x1="300" y1="280" x2="340" y2="280" stroke="#005f7a" stroke-width="2" opacity="0.25"/>
    <line x1="460" y1="280" x2="500" y2="280" stroke="#005f7a" stroke-width="2" opacity="0.25"/>
    <line x1="620" y1="280" x2="650" y2="280" stroke="#005f7a" stroke-width="2" opacity="0.25"/>
  </g>

  <!-- Bridge labels -->
  <text x="165" y="272" font-family="Consolas, monospace" font-size="6" text-anchor="middle" class="fg-4">make</text>
  <text x="320" y="272" font-family="Consolas, monospace" font-size="6" text-anchor="middle" class="fg-4">make</text>
  <text x="480" y="272" font-family="Consolas, monospace" font-size="6" text-anchor="middle" class="fg-4">make</text>
  <text x="635" y="272" font-family="Consolas, monospace" font-size="6" text-anchor="middle" class="fg-4">make</text>

  <!-- Connected Island 1 -->
  <g id="c-island-1">
    <ellipse cx="90" cy="282" rx="60" ry="35" fill="#005f7a" fill-opacity="0.06" stroke="#005f7a" stroke-width="1"/>
    <text x="90" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="middle" class="fg-1">Project A</text>
    <text x="90" y="289" font-family="Consolas, monospace" font-size="7" text-anchor="middle" class="accent-1">make install</text>
    <text x="90" y="301" font-family="Consolas, monospace" font-size="7" text-anchor="middle" class="fg-3">pyproject.toml</text>
  </g>

  <!-- Connected Island 2 -->
  <g id="c-island-2">
    <ellipse cx="240" cy="282" rx="60" ry="35" fill="#005f7a" fill-opacity="0.06" stroke="#005f7a" stroke-width="1"/>
    <text x="240" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="middle" class="fg-1">Project B</text>
    <text x="240" y="289" font-family="Consolas, monospace" font-size="7" text-anchor="middle" class="accent-1">make install</text>
    <text x="240" y="301" font-family="Consolas, monospace" font-size="7" text-anchor="middle" class="fg-3">pyproject.toml</text>
  </g>

  <!-- Connected Island 3 -->
  <g id="c-island-3">
    <ellipse cx="400" cy="282" rx="60" ry="35" fill="#005f7a" fill-opacity="0.06" stroke="#005f7a" stroke-width="1"/>
    <text x="400" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="middle" class="fg-1">Project C</text>
    <text x="400" y="289" font-family="Consolas, monospace" font-size="7" text-anchor="middle" class="accent-1">make install</text>
    <text x="400" y="301" font-family="Consolas, monospace" font-size="7" text-anchor="middle" class="fg-3">pyproject.toml</text>
  </g>

  <!-- Connected Island 4 -->
  <g id="c-island-4">
    <ellipse cx="560" cy="282" rx="60" ry="35" fill="#005f7a" fill-opacity="0.06" stroke="#005f7a" stroke-width="1"/>
    <text x="560" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="middle" class="fg-1">Project D</text>
    <text x="560" y="289" font-family="Consolas, monospace" font-size="7" text-anchor="middle" class="accent-1">make install</text>
    <text x="560" y="301" font-family="Consolas, monospace" font-size="7" text-anchor="middle" class="fg-3">pyproject.toml</text>
  </g>

  <!-- Connected Island 5 -->
  <g id="c-island-5">
    <ellipse cx="710" cy="282" rx="60" ry="35" fill="#005f7a" fill-opacity="0.06" stroke="#005f7a" stroke-width="1"/>
    <text x="710" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="middle" class="fg-1">Project E</text>
    <text x="710" y="289" font-family="Consolas, monospace" font-size="7" text-anchor="middle" class="accent-1">make install</text>
    <text x="710" y="301" font-family="Consolas, monospace" font-size="7" text-anchor="middle" class="fg-3">pyproject.toml</text>
  </g>

  <!-- Shared infrastructure labels below -->
  <g id="shared-labels">
    <line x1="60" y1="330" x2="740" y2="330" stroke="#005f7a" stroke-width="1" opacity="0.15"/>
    <text x="130" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" class="status-yes">Same structure</text>
    <text x="300" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" class="status-yes">Same commands</text>
    <text x="480" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" class="status-yes">Same conventions</text>
    <text x="660" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" class="status-yes">Same update path</text>
  </g>

  <!-- Bottom tagline -->
  <text x="400" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-3">A new teammate moves between projects without relearning anything.</text>
</svg>
