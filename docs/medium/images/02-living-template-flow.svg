<!--
  02-living-template-flow.svg
  Shows: Side-by-side flow comparing Cookiecutter (copy-once) vs Copier (living template) update paths
  Intent: Visualize how Copier enables template evolution while Cookiecutter freezes projects at scaffold time
  Theme: Stellars-Tech EU (teal/cyan primary, orange accent)

  === GRID ===
  viewBox: 0 0 800 360
  margins: left=20, right=20, top=10, bottom=10
  rhythm: 14px vertical step

  Title: y=32, centred at x=400
  Row 1 label: x=30 y=62 (Cookiecutter)
  Row 1 boxes: y=75, h=50, gap=30
    box-template-v1: x=30  w=160
    box-project:     x=250 w=160
    box-template-v2: x=470 w=160
    x-mark:          x=430 to x=450, y=85 to y=115
  Row 2 label: x=30 y=180 (Copier)
  Row 2 boxes: y=195, h=50
    box-template-v1c: x=30  w=160
    box-project-v1:   x=250 w=160
    box-template-v2c: x=470 w=160
    box-project-v2:   x=250 y=290 w=160 h=30
  Update arrow: from (550,250) down to (330,290) via (550,270)(330,270)
  Preserved card: x=660 y=195 w=120 h=80

  === LAYOUT TOPOLOGY ===
  v-stack: row-1-label, row-1-boxes, row-2-label, row-2-boxes
  h-stack(row-1): template-v1, arrow, project, x-mark, template-v2
  h-stack(row-2): template-v1c, arrow, project-v1, arrow-gap, template-v2c
  flow: template-v2c -> update-arrow -> project-v2
  === END ===
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360">
  <style>
    .fg-1 { fill: #1a5a6e; }
    .fg-2 { fill: #24697e; }
    .fg-3 { fill: #236a74; }
    .fg-4 { fill: #2b7680; }
    .accent-1 { fill: #005f7a; }
    .accent-2 { fill: #7a4a15; }
    .status-yes { fill: #1a6e3a; }
    .status-no { fill: #6e1a1a; }
    @media (prefers-color-scheme: dark) {
      .fg-1 { fill: #b8e4f0; }
      .fg-2 { fill: #8fd4e6; }
      .fg-3 { fill: #5aafc5; }
      .fg-4 { fill: #4099b3; }
      .accent-1 { fill: #5cc8e0; }
      .accent-2 { fill: #d4a04a; }
      .status-yes { fill: #44cc77; }
      .status-no { fill: #e05555; }
    }
  </style>

  <rect width="800" height="360" fill="transparent"/>

  <!-- Title -->
  <g id="title">
    <text x="400" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle" class="fg-1">Living Template: Copy Once vs Evolve Together</text>
  </g>

  <!-- Row 1: Cookiecutter (copy-once) -->
  <g id="row-cookiecutter">
    <text x="30" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" class="accent-2">Cookiecutter (copy-once)</text>

    <!-- Template v1.0 card -->
    <g id="cc-template-v1">
      <path d="M30,75 H190 V122 Q190,125 187,125 H33 Q30,125 30,122 Z" fill="#7a4a15" fill-opacity="0.04"/>
      <path d="M30,75 H190 V122 Q190,125 187,125 H33 Q30,125 30,122 Z" fill="none" stroke="#7a4a15" stroke-width="1"/>
      <rect x="30" y="75" width="160" height="5" fill="#7a4a15" opacity="0.6"/>
      <text x="110" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" class="fg-2">Template v1.0</text>
      <text x="110" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-4">scaffold once</text>
    </g>

    <!-- Arrow: template -> project -->
    <g id="cc-arrow-1" transform="translate(240, 100) rotate(0)">
      <line x1="-40" y1="0" x2="0" y2="0" stroke="#7a4a15" stroke-width="1.5" opacity="0.3"/>
      <polygon points="0,0 -8,-4 -8,4" fill="#7a4a15" opacity="0.8"/>
    </g>

    <!-- Your Project card -->
    <g id="cc-project">
      <path d="M250,75 H410 V122 Q410,125 407,125 H253 Q250,125 250,122 Z" fill="#005f7a" fill-opacity="0.04"/>
      <path d="M250,75 H410 V122 Q410,125 407,125 H253 Q250,125 250,122 Z" fill="none" stroke="#005f7a" stroke-width="1"/>
      <rect x="250" y="75" width="160" height="5" fill="#005f7a" opacity="0.6"/>
      <text x="330" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" class="fg-2">Your Project</text>
      <text x="330" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-4">frozen at v1.0</text>
    </g>

    <!-- X mark: no update path -->
    <g id="cc-x-mark">
      <line x1="430" y1="88" x2="455" y2="113" stroke="#6e1a1a" stroke-width="2.5"/>
      <line x1="430" y1="113" x2="455" y2="88" stroke="#6e1a1a" stroke-width="2.5"/>
      <text x="442" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="status-no">no path</text>
    </g>

    <!-- Template v2.0 card -->
    <g id="cc-template-v2">
      <path d="M470,75 H630 V122 Q630,125 627,125 H473 Q470,125 470,122 Z" fill="#7a4a15" fill-opacity="0.04"/>
      <path d="M470,75 H630 V122 Q630,125 627,125 H473 Q470,125 470,122 Z" fill="none" stroke="#7a4a15" stroke-width="1"/>
      <rect x="470" y="75" width="160" height="5" fill="#7a4a15" opacity="0.6"/>
      <text x="550" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" class="fg-2">Template v2.0</text>
      <text x="550" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-4">new features added</text>
    </g>
  </g>

  <!-- Row 2: Copier (living template) -->
  <g id="row-copier">
    <text x="30" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" class="accent-1">Copier (living template)</text>

    <!-- Template v1.0 card -->
    <g id="cp-template-v1">
      <path d="M30,195 H190 V242 Q190,245 187,245 H33 Q30,245 30,242 Z" fill="#005f7a" fill-opacity="0.04"/>
      <path d="M30,195 H190 V242 Q190,245 187,245 H33 Q30,245 30,242 Z" fill="none" stroke="#005f7a" stroke-width="1"/>
      <rect x="30" y="195" width="160" height="5" fill="#005f7a" opacity="0.6"/>
      <text x="110" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" class="fg-2">Template v1.0</text>
      <text x="110" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-4">copier copy</text>
    </g>

    <!-- Arrow -->
    <g id="cp-arrow-1" transform="translate(240, 220) rotate(0)">
      <line x1="-40" y1="0" x2="0" y2="0" stroke="#005f7a" stroke-width="1.5" opacity="0.3"/>
      <polygon points="0,0 -8,-4 -8,4" fill="#005f7a" opacity="0.8"/>
    </g>

    <!-- Your Project v1.0 card -->
    <g id="cp-project-v1">
      <path d="M250,195 H410 V242 Q410,245 407,245 H253 Q250,245 250,242 Z" fill="#005f7a" fill-opacity="0.04"/>
      <path d="M250,195 H410 V242 Q410,245 407,245 H253 Q250,245 250,242 Z" fill="none" stroke="#005f7a" stroke-width="1"/>
      <rect x="250" y="195" width="160" height="5" fill="#005f7a" opacity="0.6"/>
      <text x="330" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" class="fg-2">Your Project v1.0</text>
      <text x="330" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-4">.copier-answers.yml</text>
    </g>

    <!-- Template v2.0 card -->
    <g id="cp-template-v2">
      <path d="M470,195 H630 V242 Q630,245 627,245 H473 Q470,245 470,242 Z" fill="#005f7a" fill-opacity="0.04"/>
      <path d="M470,195 H630 V242 Q630,245 627,245 H473 Q470,245 470,242 Z" fill="none" stroke="#005f7a" stroke-width="1"/>
      <rect x="470" y="195" width="160" height="5" fill="#005f7a" opacity="0.6"/>
      <text x="550" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" class="fg-2">Template v2.0</text>
      <text x="550" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-4">new features</text>
    </g>

    <!-- Update arrow: L-shaped from template-v2 bottom to project-v2 -->
    <g id="cp-update-arrow">
      <line x1="550" y1="250" x2="550" y2="305" stroke="#1a6e3a" stroke-width="1.5" stroke-dasharray="6,3"/>
      <line x1="550" y1="305" x2="418" y2="305" stroke="#1a6e3a" stroke-width="1.5" stroke-dasharray="6,3"/>
      <g transform="translate(410, 305) rotate(180)">
        <polygon points="0,0 -8,-4 -8,4" fill="#1a6e3a" opacity="0.8"/>
      </g>
      <text x="485" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" class="status-yes">copier update --trust</text>
    </g>

    <!-- Your Project v2.0 card (result of update) -->
    <g id="cp-project-v2">
      <path d="M250,290 H410 V337 Q410,340 407,340 H253 Q250,340 250,337 Z" fill="#1a6e3a" fill-opacity="0.04"/>
      <path d="M250,290 H410 V337 Q410,340 407,340 H253 Q250,340 250,337 Z" fill="none" stroke="#1a6e3a" stroke-width="1"/>
      <rect x="250" y="290" width="160" height="5" fill="#1a6e3a" opacity="0.6"/>
      <text x="330" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" class="status-yes">Your Project v2.0</text>
    </g>

    <!-- Preserved note card -->
    <g id="cp-preserved">
      <path d="M660,195 H780 V272 Q780,275 777,275 H663 Q660,275 660,272 Z" fill="#005f7a" fill-opacity="0.04"/>
      <path d="M660,195 H780 V272 Q780,275 777,275 H663 Q660,275 660,272 Z" fill="none" stroke="#005f7a" stroke-width="0.8" opacity="0.25"/>
      <rect x="660" y="195" width="120" height="4" fill="#005f7a" opacity="0.15"/>
      <text x="720" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" class="fg-2">Preserved:</text>
      <text x="720" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-4">Version bumps</text>
      <text x="720" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-4">Custom licenses</text>
      <text x="720" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-4">Your code</text>
    </g>
  </g>
</svg>
