<!--
  20-cookiecutter-tribute.svg
  Shows: A tribute to cookiecutter-data-science - the foundational ideas it introduced,
  rendered as carved stone tablets or pillars that remain standing, with the copier fork
  building on top of them. Like standing on the shoulders of giants.
  Intent: Respectful acknowledgement that the fork preserves and extends, not replaces
  Theme: Stellars-Tech EU

  === GRID ===
  viewBox: 0 0 800 340
  margins: left=20, right=20, top=10, bottom=10

  Title: y=24
  5 pillars in a row, each representing a foundational idea kept from upstream:
    pillar positions: x=55, 205, 355, 505, 655  w=100  h=180  y=55
  Foundation base: x=30 y=235 w=740 h=30 (shared base connecting all pillars)
  Top extension layer: x=30 y=275 w=740 h=40 (what copier-data-science adds)

  === LAYOUT TOPOLOGY ===
  h-stack: pillar-1..pillar-5
  v-stack: pillars, foundation-base, extension-layer
  === END ===
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340">
  <style>
    .fg-1 { fill: #1a5a6e; }
    .fg-2 { fill: #24697e; }
    .fg-3 { fill: #236a74; }
    .fg-4 { fill: #2b7680; }
    .accent-1 { fill: #005f7a; }
    .accent-2 { fill: #7a4a15; }
    @media (prefers-color-scheme: dark) {
      .fg-1 { fill: #b8e4f0; }
      .fg-2 { fill: #8fd4e6; }
      .fg-3 { fill: #5aafc5; }
      .fg-4 { fill: #4099b3; }
      .accent-1 { fill: #5cc8e0; }
      .accent-2 { fill: #d4a04a; }
    }
  </style>

  <rect width="800" height="340" fill="transparent"/>

  <text x="400" y="20" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="1" class="fg-2">STANDING ON THE SHOULDERS OF COOKIECUTTER-DATA-SCIENCE</text>

  <!-- Foundation base (shared ground) -->
  <g id="foundation">
    <rect x="30" y="232" width="740" height="32" rx="2" fill="#7a4a15" fill-opacity="0.08" stroke="#7a4a15" stroke-width="1"/>
    <text x="400" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" class="accent-2">cookiecutter-data-science by DrivenData</text>
    <text x="400" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="7" text-anchor="middle" class="fg-4">The conventions we all follow. We kept every one of them.</text>
  </g>

  <!-- Pillar 1: Directory Structure -->
  <g id="pillar-1">
    <rect x="42" y="55" width="110" height="175" rx="2" fill="#7a4a15" fill-opacity="0.04" stroke="#7a4a15" stroke-width="0.8" opacity="0.6"/>
    <!-- Capital (top decorative bar) -->
    <rect x="38" y="55" width="118" height="8" rx="2" fill="#7a4a15" fill-opacity="0.10" stroke="#7a4a15" stroke-width="0.5" opacity="0.5"/>
    <!-- Base (bottom wider bar) -->
    <rect x="38" y="222" width="118" height="10" rx="2" fill="#7a4a15" fill-opacity="0.10" stroke="#7a4a15" stroke-width="0.5" opacity="0.5"/>

    <!-- Icon: folder-tree (Lucide, ISC license) -->
    <g transform="translate(80, 76) scale(0.667)" fill="none" stroke="#7a4a15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
      <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
    </g>
    <text x="97" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" class="fg-1">Directory</text>
    <text x="97" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" class="fg-1">Structure</text>
    <text x="97" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle" class="fg-3">data/raw/</text>
    <text x="97" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle" class="fg-3">data/processed/</text>
    <text x="97" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle" class="fg-3">notebooks/</text>
    <text x="97" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle" class="fg-3">models/</text>
    <text x="97" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle" class="fg-3">reports/</text>
    <text x="97" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="7" text-anchor="middle" class="fg-4">Logical and standard</text>
  </g>

  <!-- Pillar 2: Immutable Data -->
  <g id="pillar-2">
    <rect x="192" y="55" width="110" height="175" rx="2" fill="#7a4a15" fill-opacity="0.04" stroke="#7a4a15" stroke-width="0.8" opacity="0.6"/>
    <rect x="188" y="55" width="118" height="8" rx="2" fill="#7a4a15" fill-opacity="0.10" stroke="#7a4a15" stroke-width="0.5" opacity="0.5"/>
    <rect x="188" y="222" width="118" height="10" rx="2" fill="#7a4a15" fill-opacity="0.10" stroke="#7a4a15" stroke-width="0.5" opacity="0.5"/>

    <!-- Icon: lock (Lucide, ISC license) -->
    <g transform="translate(230, 76) scale(0.667)" fill="none" stroke="#7a4a15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
      <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </g>
    <text x="247" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" class="fg-1">Immutable</text>
    <text x="247" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" class="fg-1">Data</text>
    <text x="247" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle" class="fg-3">raw/ is read-only</text>
    <text x="247" y="156" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle" class="fg-3">Never edit in place</text>
    <text x="247" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle" class="fg-3">Pipeline transforms</text>
    <text x="247" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle" class="fg-3">to processed/</text>
    <text x="247" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="7" text-anchor="middle" class="fg-4">Correctness first</text>
  </g>

  <!-- Pillar 3: DAG Philosophy -->
  <g id="pillar-3">
    <rect x="342" y="55" width="110" height="175" rx="2" fill="#7a4a15" fill-opacity="0.04" stroke="#7a4a15" stroke-width="0.8" opacity="0.6"/>
    <rect x="338" y="55" width="118" height="8" rx="2" fill="#7a4a15" fill-opacity="0.10" stroke="#7a4a15" stroke-width="0.5" opacity="0.5"/>
    <rect x="338" y="222" width="118" height="10" rx="2" fill="#7a4a15" fill-opacity="0.10" stroke="#7a4a15" stroke-width="0.5" opacity="0.5"/>

    <!-- Icon: git-branch (Lucide, ISC license) -->
    <g transform="translate(380, 76) scale(0.667)" fill="none" stroke="#7a4a15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
      <line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="6" r="3"/>
      <path d="M18 9a9 9 0 0 1-9 9"/>
    </g>
    <text x="397" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" class="fg-1">Analysis</text>
    <text x="397" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" class="fg-1">as DAG</text>
    <text x="397" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle" class="fg-3">Reproducible steps</text>
    <text x="397" y="156" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle" class="fg-3">No circular deps</text>
    <text x="397" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle" class="fg-3">Trace any output</text>
    <text x="397" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle" class="fg-3">back to raw data</text>
    <text x="397" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="7" text-anchor="middle" class="fg-4">Reproducibility built in</text>
  </g>

  <!-- Pillar 4: Make as Task Runner -->
  <g id="pillar-4">
    <rect x="492" y="55" width="110" height="175" rx="2" fill="#7a4a15" fill-opacity="0.04" stroke="#7a4a15" stroke-width="0.8" opacity="0.6"/>
    <rect x="488" y="55" width="118" height="8" rx="2" fill="#7a4a15" fill-opacity="0.10" stroke="#7a4a15" stroke-width="0.5" opacity="0.5"/>
    <rect x="488" y="222" width="118" height="10" rx="2" fill="#7a4a15" fill-opacity="0.10" stroke="#7a4a15" stroke-width="0.5" opacity="0.5"/>

    <!-- Icon: terminal (Lucide, ISC license) -->
    <g transform="translate(530, 76) scale(0.667)" fill="none" stroke="#7a4a15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
      <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
    </g>
    <text x="547" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" class="fg-1">Make as</text>
    <text x="547" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" class="fg-1">Task Runner</text>
    <text x="547" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle" class="fg-3">Discoverable targets</text>
    <text x="547" y="156" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle" class="fg-3">Dependency chains</text>
    <text x="547" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle" class="fg-3">Cross-platform</text>
    <text x="547" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle" class="fg-3">Self-documenting</text>
    <text x="547" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="7" text-anchor="middle" class="fg-4">One interface for everything</text>
  </g>

  <!-- Pillar 5: Source as Package -->
  <g id="pillar-5">
    <rect x="642" y="55" width="110" height="175" rx="2" fill="#7a4a15" fill-opacity="0.04" stroke="#7a4a15" stroke-width="0.8" opacity="0.6"/>
    <rect x="638" y="55" width="118" height="8" rx="2" fill="#7a4a15" fill-opacity="0.10" stroke="#7a4a15" stroke-width="0.5" opacity="0.5"/>
    <rect x="638" y="222" width="118" height="10" rx="2" fill="#7a4a15" fill-opacity="0.10" stroke="#7a4a15" stroke-width="0.5" opacity="0.5"/>

    <!-- Icon: package (Lucide, ISC license) -->
    <g transform="translate(680, 76) scale(0.667)" fill="none" stroke="#7a4a15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
      <path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/>
      <path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/>
    </g>
    <text x="697" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" class="fg-1">Source as</text>
    <text x="697" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" class="fg-1">Package</text>
    <text x="697" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle" class="fg-3">pip install -e .</text>
    <text x="697" y="156" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle" class="fg-3">Import in notebooks</text>
    <text x="697" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle" class="fg-3">Refactor from</text>
    <text x="697" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle" class="fg-3">notebook to module</text>
    <text x="697" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="7" text-anchor="middle" class="fg-4">Code reuse built in</text>
  </g>

  <!-- Extension layer: what copier-data-science adds on top -->
  <g id="extension">
    <rect x="30" y="272" width="740" height="38" rx="2" fill="#005f7a" fill-opacity="0.06" stroke="#005f7a" stroke-width="1.2"/>
    <rect x="30" y="272" width="740" height="5" fill="#005f7a" opacity="0.5"/>
    <text x="400" y="293" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" class="accent-1">copier-data-science builds on top</text>
    <text x="400" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle" class="fg-3">+ Copier updates  + uv default  + local envs  + dev/prod split  + Docker  + encryption  + auto kernels</text>
  </g>

  <!-- Bottom tagline -->
  <text x="400" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-style="italic" text-anchor="middle" class="fg-4">All credit for the original architecture goes to the upstream team.</text>
</svg>
