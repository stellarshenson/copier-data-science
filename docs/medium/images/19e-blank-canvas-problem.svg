<!--
  19e-blank-canvas-problem.svg
  Shows: Top - empty intimidating rectangle with micro-decisions radiating as cracks.
  Bottom - same rectangle filled with clean template grid, decisions resolved.
  Intent: Visualize the overwhelm of starting from scratch vs template confidence
  Theme: Stellars-Tech EU

  === GRID ===
  viewBox: 0 0 800 420
  margins: left=20, right=20, top=10, bottom=10

  Title: y=22
  Top empty rect: x=200 y=38 w=400 h=80
  Crack/decision lines radiating from rect edges to question labels
  Arrow down: y=200
  Bottom filled rect: x=200 y=240 w=400 h=80 (with grid inside)
  Resolved labels around bottom rect

  === LAYOUT TOPOLOGY ===
  v-stack: empty-rect, arrow, filled-rect
  radiate: empty-rect -> [question-labels]
  radiate: filled-rect -> [answer-labels]
  === END ===
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <style>
    .fg-1 { fill: #1a5a6e; }
    .fg-2 { fill: #24697e; }
    .fg-3 { fill: #236a74; }
    .fg-4 { fill: #2b7680; }
    .accent-1 { fill: #005f7a; }
    .accent-2 { fill: #7a4a15; }
    .status-yes { fill: #1a6e3a; }
    @media (prefers-color-scheme: dark) {
      .fg-1 { fill: #b8e4f0; }
      .fg-2 { fill: #8fd4e6; }
      .fg-3 { fill: #5aafc5; }
      .fg-4 { fill: #4099b3; }
      .accent-1 { fill: #5cc8e0; }
      .accent-2 { fill: #d4a04a; }
      .status-yes { fill: #44cc77; }
    }
  </style>

  <rect width="800" height="420" fill="transparent"/>

  <text x="400" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="1" class="fg-2">THE BLANK CANVAS PROBLEM</text>

  <!-- ================================ -->
  <!-- TOP: Empty project, many cracks  -->
  <!-- ================================ -->

  <!-- The empty rectangle -->
  <g id="empty-project">
    <rect x="220" y="42" width="360" height="90" rx="4" fill="#7a4a15" fill-opacity="0.03" stroke="#7a4a15" stroke-width="1.5" stroke-dasharray="8,4"/>
    <text x="400" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" class="fg-4">mkdir my-project</text>
    <text x="400" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" class="fg-4">Now what?</text>
  </g>

  <!-- Crack lines radiating outward with decision questions -->
  <g id="cracks" opacity="0.6">
    <!-- Left side cracks -->
    <line x1="220" y1="55" x2="60" y2="38" stroke="#7a4a15" stroke-width="0.8"/>
    <line x1="60" y1="38" x2="55" y2="35" stroke="#7a4a15" stroke-width="0.8"/>
    <line x1="62" y1="38" x2="58" y2="42" stroke="#7a4a15" stroke-width="0.5"/>

    <line x1="220" y1="80" x2="45" y2="85" stroke="#7a4a15" stroke-width="0.8"/>
    <line x1="45" y1="85" x2="40" y2="82" stroke="#7a4a15" stroke-width="0.5"/>
    <line x1="47" y1="85" x2="42" y2="90" stroke="#7a4a15" stroke-width="0.5"/>

    <line x1="220" y1="115" x2="70" y2="140" stroke="#7a4a15" stroke-width="0.8"/>
    <line x1="70" y1="140" x2="65" y2="138" stroke="#7a4a15" stroke-width="0.5"/>

    <!-- Right side cracks -->
    <line x1="580" y1="55" x2="740" y2="38" stroke="#7a4a15" stroke-width="0.8"/>
    <line x1="740" y1="38" x2="745" y2="35" stroke="#7a4a15" stroke-width="0.8"/>
    <line x1="738" y1="38" x2="743" y2="42" stroke="#7a4a15" stroke-width="0.5"/>

    <line x1="580" y1="80" x2="755" y2="85" stroke="#7a4a15" stroke-width="0.8"/>
    <line x1="755" y1="85" x2="760" y2="82" stroke="#7a4a15" stroke-width="0.5"/>

    <line x1="580" y1="115" x2="730" y2="140" stroke="#7a4a15" stroke-width="0.8"/>
    <line x1="730" y1="140" x2="735" y2="138" stroke="#7a4a15" stroke-width="0.5"/>

    <!-- Bottom cracks -->
    <line x1="300" y1="132" x2="250" y2="168" stroke="#7a4a15" stroke-width="0.8"/>
    <line x1="400" y1="132" x2="400" y2="172" stroke="#7a4a15" stroke-width="0.8"/>
    <line x1="500" y1="132" x2="550" y2="168" stroke="#7a4a15" stroke-width="0.8"/>
  </g>

  <!-- Decision question labels -->
  <g id="questions">
    <!-- Left -->
    <text x="28" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-style="italic" class="accent-2">Which env manager?</text>
    <text x="15" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-style="italic" class="accent-2">pip or conda or uv?</text>
    <text x="22" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-style="italic" class="accent-2">Where do models go?</text>

    <!-- Right -->
    <text x="660" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-style="italic" class="accent-2">Dev deps separate?</text>
    <text x="665" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-style="italic" class="accent-2">What Python version?</text>
    <text x="650" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-style="italic" class="accent-2">How to sync data?</text>

    <!-- Bottom -->
    <text x="200" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-style="italic" class="accent-2">Kernel name?</text>
    <text x="370" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-style="italic" class="accent-2">Local or global env?</text>
    <text x="530" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-style="italic" class="accent-2">.env secrets?</text>
  </g>

  <!-- Transition arrow -->
  <g id="transition">
    <line x1="400" y1="196" x2="400" y2="228" stroke="#005f7a" stroke-width="1.5" opacity="0.4"/>
    <polygon points="396,226 400,234 404,226" fill="#005f7a" opacity="0.6"/>
    <text x="430" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" class="accent-1">Use a template</text>
  </g>

  <!-- ================================ -->
  <!-- BOTTOM: Filled template grid     -->
  <!-- ================================ -->

  <g id="filled-project">
    <rect x="220" y="244" width="360" height="90" rx="4" fill="#005f7a" fill-opacity="0.06" stroke="#005f7a" stroke-width="1.5"/>

    <!-- Internal grid lines suggesting structure -->
    <line x1="220" y1="270" x2="580" y2="270" stroke="#005f7a" stroke-width="0.5" opacity="0.15"/>
    <line x1="220" y1="296" x2="580" y2="296" stroke="#005f7a" stroke-width="0.5" opacity="0.15"/>
    <line x1="340" y1="244" x2="340" y2="334" stroke="#005f7a" stroke-width="0.5" opacity="0.15"/>
    <line x1="460" y1="244" x2="460" y2="334" stroke="#005f7a" stroke-width="0.5" opacity="0.15"/>

    <!-- Grid cell labels -->
    <text x="280" y="262" font-family="Consolas, monospace" font-size="8" text-anchor="middle" class="fg-3">data/</text>
    <text x="400" y="262" font-family="Consolas, monospace" font-size="8" text-anchor="middle" class="fg-3">lib_project/</text>
    <text x="520" y="262" font-family="Consolas, monospace" font-size="8" text-anchor="middle" class="fg-3">notebooks/</text>
    <text x="280" y="288" font-family="Consolas, monospace" font-size="8" text-anchor="middle" class="fg-3">models/</text>
    <text x="400" y="288" font-family="Consolas, monospace" font-size="8" text-anchor="middle" class="fg-3">tests/</text>
    <text x="520" y="288" font-family="Consolas, monospace" font-size="8" text-anchor="middle" class="fg-3">docs/</text>
    <text x="280" y="314" font-family="Consolas, monospace" font-size="8" text-anchor="middle" class="fg-3">Makefile</text>
    <text x="400" y="314" font-family="Consolas, monospace" font-size="8" text-anchor="middle" class="fg-3">pyproject.toml</text>
    <text x="520" y="314" font-family="Consolas, monospace" font-size="8" text-anchor="middle" class="fg-3">.env</text>
  </g>

  <!-- Resolved answer labels radiating from filled rect -->
  <g id="answers">
    <!-- Left -->
    <line x1="220" y1="258" x2="145" y2="250" stroke="#005f7a" stroke-width="0.8" opacity="0.2"/>
    <text x="30" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="9" class="status-yes">uv by default</text>

    <line x1="220" y1="284" x2="145" y2="288" stroke="#005f7a" stroke-width="0.8" opacity="0.2"/>
    <text x="30" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="9" class="status-yes">Local .venv/</text>

    <line x1="220" y1="310" x2="145" y2="322" stroke="#005f7a" stroke-width="0.8" opacity="0.2"/>
    <text x="30" y="324" font-family="Segoe UI, Arial, sans-serif" font-size="9" class="status-yes">Dev/prod separated</text>

    <!-- Right -->
    <line x1="580" y1="258" x2="655" y2="250" stroke="#005f7a" stroke-width="0.8" opacity="0.2"/>
    <text x="662" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="9" class="status-yes">Python 3.12</text>

    <line x1="580" y1="284" x2="655" y2="288" stroke="#005f7a" stroke-width="0.8" opacity="0.2"/>
    <text x="662" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="9" class="status-yes">Kernel auto-registered</text>

    <line x1="580" y1="310" x2="655" y2="322" stroke="#005f7a" stroke-width="0.8" opacity="0.2"/>
    <text x="662" y="324" font-family="Segoe UI, Arial, sans-serif" font-size="9" class="status-yes">AES-256 encryption</text>
  </g>

  <!-- Bottom command -->
  <g id="command">
    <rect x="300" y="355" width="200" height="28" rx="4" fill="#005f7a" fill-opacity="0.06" stroke="#005f7a" stroke-width="1"/>
    <text x="400" y="374" font-family="Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" class="accent-1">$ make install</text>
  </g>

  <text x="400" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-3">Every decision already made. Every tool pre-configured.</text>
</svg>
