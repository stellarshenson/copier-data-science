<!--
  17-broad-capabilities.svg
  Shows: Central Makefile hub radiating outward to 7 capability nodes arranged in a semicircle,
  each with an icon and short label. Conveying breadth without complexity.
  Intent: One glance shows everything the template provides out of the box
  Theme: Stellars-Tech EU

  === GRID ===
  viewBox: 0 0 800 320
  margins: left=20, right=20, top=10, bottom=10

  Title: y=22
  Central hub: cx=400 cy=175 r=48
  7 capability nodes in arc from left to right:
    node positions (cx,cy) on ellipse rx=310 ry=120 centred at (400,180):
      1: (90, 175)    Env Management
      2: (130, 85)    Cloud Storage
      3: (270, 48)    Docker
      4: (400, 35)    Encrypted Secrets
      5: (530, 48)    Jupyter Kernels
      6: (670, 85)    Linting
      7: (710, 175)   Build + Publish

  Node size: 90w x 70h cards, r=3
  Connector lines from hub edge to node

  === LAYOUT TOPOLOGY ===
  hub-and-spoke: makefile-hub -> [env, cloud, docker, secrets, jupyter, lint, build]
  arc arrangement: nodes placed on upper semicircle
  === END ===
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320">
  <style>
    .fg-1 { fill: #1a5a6e; }
    .fg-2 { fill: #24697e; }
    .fg-3 { fill: #236a74; }
    .fg-4 { fill: #2b7680; }
    .accent-1 { fill: #005f7a; }
    .accent-2 { fill: #7a4a15; }
    @media (prefers-color-scheme: dark) {
      .fg-1 { fill: #b8e4f0; }
      .fg-2 { fill: #8fd4e6; }
      .fg-3 { fill: #5aafc5; }
      .fg-4 { fill: #4099b3; }
      .accent-1 { fill: #5cc8e0; }
      .accent-2 { fill: #d4a04a; }
    }
  </style>

  <rect width="800" height="320" fill="transparent"/>

  <text x="400" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="1" class="fg-2">BROAD CAPABILITIES, ONE TEMPLATE</text>

  <!-- Connector lines (behind everything) -->
  <g id="connectors" opacity="0.2">
    <line x1="355" y1="190" x2="180" y2="190" stroke="#005f7a" stroke-width="1"/>
    <line x1="362" y1="162" x2="175" y2="100" stroke="#005f7a" stroke-width="1"/>
    <line x1="375" y1="148" x2="280" y2="92" stroke="#005f7a" stroke-width="1"/>
    <line x1="400" y1="142" x2="430" y2="92" stroke="#005f7a" stroke-width="1"/>
    <line x1="425" y1="148" x2="580" y2="92" stroke="#005f7a" stroke-width="1"/>
    <line x1="438" y1="168" x2="620" y2="125" stroke="#005f7a" stroke-width="1"/>
    <line x1="445" y1="190" x2="620" y2="190" stroke="#005f7a" stroke-width="1"/>
  </g>

  <!-- Central hub: Makefile -->
  <g id="hub">
    <circle cx="400" cy="190" r="48" fill="#005f7a" fill-opacity="0.08" stroke="#005f7a" stroke-width="1.5"/>
    <text x="400" y="182" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" class="fg-1">Makefile</text>
    <text x="400" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-3">40+ targets</text>
    <text x="400" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" class="fg-4">adapts to config</text>
  </g>

  <!-- Node 1: Environment Management (left) -->
  <g id="node-env">
    <path d="M40,160 H180 V217 Q180,220 177,220 H43 Q40,220 40,217 Z" fill="#005f7a" fill-opacity="0.06"/>
    <path d="M40,160 H180 V217 Q180,220 177,220 H43 Q40,220 40,217 Z" fill="none" stroke="#005f7a" stroke-width="1"/>
    <rect x="40" y="160" width="140" height="5" fill="#005f7a" opacity="0.5"/>
    <!-- Icon: layers (Lucide, ISC license) -->
    <g transform="translate(50, 172) scale(0.5)" fill="none" stroke="#005f7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
      <path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/>
      <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/>
      <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>
    </g>
    <text x="68" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" class="fg-1">3 Env Managers</text>
    <text x="52" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="9" class="fg-3">uv, conda, virtualenv</text>
    <text x="52" y="213" font-family="Segoe UI, Arial, sans-serif" font-size="8" class="fg-4">Local by default</text>
  </g>

  <!-- Node 2: Cloud Storage (upper-left) -->
  <g id="node-cloud">
    <path d="M105,65 H245 V122 Q245,125 242,125 H108 Q105,125 105,122 Z" fill="#7a4a15" fill-opacity="0.06"/>
    <path d="M105,65 H245 V122 Q245,125 242,125 H108 Q105,125 105,122 Z" fill="none" stroke="#7a4a15" stroke-width="1"/>
    <rect x="105" y="65" width="140" height="5" fill="#7a4a15" opacity="0.5"/>
    <!-- Icon: cloud (Lucide, ISC license) -->
    <g transform="translate(115, 78) scale(0.5)" fill="none" stroke="#7a4a15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
      <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
    </g>
    <text x="133" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" class="fg-1">Cloud Storage</text>
    <text x="117" y="106" font-family="Segoe UI, Arial, sans-serif" font-size="9" class="fg-3">S3, Azure, GCS</text>
    <text x="117" y="119" font-family="Segoe UI, Arial, sans-serif" font-size="8" class="fg-4">sync_data + sync_models</text>
  </g>

  <!-- Node 3: Docker (upper-left of center) -->
  <g id="node-docker">
    <path d="M210,32 H350 V89 Q350,92 347,92 H213 Q210,92 210,89 Z" fill="#005f7a" fill-opacity="0.06"/>
    <path d="M210,32 H350 V89 Q350,92 347,92 H213 Q210,92 210,89 Z" fill="none" stroke="#005f7a" stroke-width="1"/>
    <rect x="210" y="32" width="140" height="5" fill="#005f7a" opacity="0.5"/>
    <!-- Icon: container (Lucide, ISC license) -->
    <g transform="translate(220, 44) scale(0.5)" fill="none" stroke="#005f7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
      <path d="M22 7.7c0-.6-.4-1.2-.8-1.5l-6.3-3.9a1.72 1.72 0 0 0-1.7 0l-10.3 6c-.5.2-.9.8-.9 1.4v6.6c0 .5.4 1.2.8 1.5l6.3 3.9a1.72 1.72 0 0 0 1.7 0l10.3-6c.5-.3.9-1 .9-1.5Z"/>
      <path d="M10 21.9V14L2.1 9.1"/><path d="m10 14 11.9-6.9"/>
    </g>
    <text x="238" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" class="fg-1">Docker</text>
    <text x="222" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="9" class="fg-3">build / run / push</text>
    <text x="222" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="8" class="fg-4">Wheel-based, uv or pip</text>
  </g>

  <!-- Node 4: Encrypted Secrets (top-center) -->
  <g id="node-secrets">
    <path d="M360,32 H500 V89 Q500,92 497,92 H363 Q360,92 360,89 Z" fill="#7a4a15" fill-opacity="0.06"/>
    <path d="M360,32 H500 V89 Q500,92 497,92 H363 Q360,92 360,89 Z" fill="none" stroke="#7a4a15" stroke-width="1"/>
    <rect x="360" y="32" width="140" height="5" fill="#7a4a15" opacity="0.5"/>
    <!-- Icon: lock (Lucide, ISC license) -->
    <g transform="translate(370, 44) scale(0.5)" fill="none" stroke="#7a4a15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
      <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </g>
    <text x="388" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" class="fg-1">Secrets</text>
    <text x="372" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="9" class="fg-3">.env AES-256</text>
    <text x="372" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="8" class="fg-4">Auto-decrypt on install</text>
  </g>

  <!-- Node 5: Jupyter Kernels (upper-right of center) -->
  <g id="node-jupyter">
    <path d="M510,32 H650 V89 Q650,92 647,92 H513 Q510,92 510,89 Z" fill="#005f7a" fill-opacity="0.06"/>
    <path d="M510,32 H650 V89 Q650,92 647,92 H513 Q510,92 510,89 Z" fill="none" stroke="#005f7a" stroke-width="1"/>
    <rect x="510" y="32" width="140" height="5" fill="#005f7a" opacity="0.5"/>
    <!-- Icon: cpu (Lucide, ISC license) -->
    <g transform="translate(520, 44) scale(0.5)" fill="none" stroke="#005f7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
      <rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/>
      <path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/>
      <path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/>
    </g>
    <text x="538" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" class="fg-1">Jupyter Kernel</text>
    <text x="522" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="9" class="fg-3">Auto-register + cleanup</text>
    <text x="522" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="8" class="fg-4">nb_venv/conda_kernels</text>
  </g>

  <!-- Node 6: Linting (right, between Jupyter and Build) -->
  <g id="node-lint">
    <path d="M620,95 H760 V152 Q760,155 757,155 H623 Q620,155 620,152 Z" fill="#7a4a15" fill-opacity="0.06"/>
    <path d="M620,95 H760 V152 Q760,155 757,155 H623 Q620,155 620,152 Z" fill="none" stroke="#7a4a15" stroke-width="1"/>
    <rect x="620" y="95" width="140" height="5" fill="#7a4a15" opacity="0.5"/>
    <!-- Icon: check-circle (Lucide, ISC license) -->
    <g transform="translate(630, 108) scale(0.5)" fill="none" stroke="#7a4a15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
      <circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
    </g>
    <text x="648" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" class="fg-1">Linting</text>
    <text x="632" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="9" class="fg-3">ruff or flake8+black</text>
    <text x="632" y="149" font-family="Segoe UI, Arial, sans-serif" font-size="8" class="fg-4">make lint / make format</text>
  </g>

  <!-- Node 7: Build + Publish (right) -->
  <g id="node-build">
    <path d="M620,160 H760 V217 Q760,220 757,220 H623 Q620,220 620,217 Z" fill="#005f7a" fill-opacity="0.06"/>
    <path d="M620,160 H760 V217 Q760,220 757,220 H623 Q620,220 620,217 Z" fill="none" stroke="#005f7a" stroke-width="1"/>
    <rect x="620" y="160" width="140" height="5" fill="#005f7a" opacity="0.5"/>
    <!-- Icon: rocket (Lucide, ISC license) -->
    <g transform="translate(630, 172) scale(0.5)" fill="none" stroke="#005f7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
      <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
      <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
    </g>
    <text x="648" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" class="fg-1">Build + Publish</text>
    <text x="632" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="9" class="fg-3">Auto-increment version</text>
    <text x="632" y="213" font-family="Segoe UI, Arial, sans-serif" font-size="8" class="fg-4">make build / make publish</text>
  </g>

  <!-- Bottom tagline -->
  <text x="400" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" class="fg-3">All configured by your answers during scaffolding.</text>
  <text x="400" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" class="fg-3">Only relevant targets appear in your Makefile.</text>
</svg>
