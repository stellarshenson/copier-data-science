<!--
  03-standardization-benefits.svg
  Shows: Hub-and-spoke diagram with "Standardized Template" at centre and 6 benefit spokes
  Intent: Visualize compounding benefits of project standardization (time, onboarding, interoperability, portability, reproducibility, evolvability)
  Theme: Stellars-Tech EU (teal/cyan primary, orange accent)

  === GRID ===
  viewBox: 0 0 800 420
  margins: left=20, right=20, top=10, bottom=10

  Hub: cx=400 cy=210 r=55
  Spoke cards: 200w x 70h, r=3 bottom corners
    top-left:     x=50  y=45
    top-right:    x=550 y=45
    mid-left:     x=20  y=175
    mid-right:    x=580 y=175
    bot-left:     x=50  y=310
    bot-right:    x=550 y=310

  Connector lines from hub edge to card edge (not through hub circle)

  === LAYOUT TOPOLOGY ===
  hub-and-spoke: hub -> [time, onboarding, interop, portability, repro, evolve]
  === END ===
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <style>
    .fg-1 { fill: #1a5a6e; }
    .fg-2 { fill: #24697e; }
    .fg-3 { fill: #236a74; }
    .fg-4 { fill: #2b7680; }
    .accent-1 { fill: #005f7a; }
    .accent-2 { fill: #7a4a15; }
    @media (prefers-color-scheme: dark) {
      .fg-1 { fill: #b8e4f0; }
      .fg-2 { fill: #8fd4e6; }
      .fg-3 { fill: #5aafc5; }
      .fg-4 { fill: #4099b3; }
      .accent-1 { fill: #5cc8e0; }
      .accent-2 { fill: #d4a04a; }
    }
  </style>

  <rect width="800" height="420" fill="transparent"/>

  <!-- Title -->
  <g id="title">
    <text x="400" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle" class="fg-1">Why Standardization Compounds</text>
  </g>

  <!-- Connector lines (behind everything) -->
  <g id="connectors">
    <line x1="360" y1="175" x2="200" y2="105" stroke="#005f7a" stroke-width="1" opacity="0.2"/>
    <line x1="440" y1="175" x2="600" y2="105" stroke="#005f7a" stroke-width="1" opacity="0.2"/>
    <line x1="345" y1="210" x2="220" y2="210" stroke="#005f7a" stroke-width="1" opacity="0.2"/>
    <line x1="455" y1="210" x2="580" y2="210" stroke="#005f7a" stroke-width="1" opacity="0.2"/>
    <line x1="360" y1="245" x2="200" y2="320" stroke="#005f7a" stroke-width="1" opacity="0.2"/>
    <line x1="440" y1="245" x2="600" y2="320" stroke="#005f7a" stroke-width="1" opacity="0.2"/>
  </g>

  <!-- Central hub -->
  <g id="hub">
    <circle cx="400" cy="210" r="55" fill="#005f7a" fill-opacity="0.06" stroke="#005f7a" stroke-width="1.5"/>
    <text x="400" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" class="fg-1">Standardized</text>
    <text x="400" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" class="fg-1">Template</text>
  </g>

  <!-- Spoke 1: Time Savings (top-left) -->
  <g id="spoke-time">
    <path d="M50,55 H250 V112 Q250,115 247,115 H53 Q50,115 50,112 Z" fill="#7a4a15" fill-opacity="0.04"/>
    <path d="M50,55 H250 V112 Q250,115 247,115 H53 Q50,115 50,112 Z" fill="none" stroke="#7a4a15" stroke-width="1"/>
    <rect x="50" y="55" width="200" height="5" fill="#7a4a15" opacity="0.6"/>
    <text x="150" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" class="accent-2">Time Savings</text>
    <text x="150" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-3">make install - one command setup</text>
    <text x="150" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-4">No manual post-scaffold fixes</text>
  </g>

  <!-- Spoke 2: Team Onboarding (top-right) -->
  <g id="spoke-onboarding">
    <path d="M550,55 H750 V112 Q750,115 747,115 H553 Q550,115 550,112 Z" fill="#7a4a15" fill-opacity="0.04"/>
    <path d="M550,55 H750 V112 Q750,115 747,115 H553 Q550,115 550,112 Z" fill="none" stroke="#7a4a15" stroke-width="1"/>
    <rect x="550" y="55" width="200" height="5" fill="#7a4a15" opacity="0.6"/>
    <text x="650" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" class="accent-2">Team Onboarding</text>
    <text x="650" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-3">New hire contributes on day 1</text>
    <text x="650" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-4">Same structure across all projects</text>
  </g>

  <!-- Spoke 3: Interoperability (mid-left) -->
  <g id="spoke-interop">
    <path d="M20,175 H220 V232 Q220,235 217,235 H23 Q20,235 20,232 Z" fill="#005f7a" fill-opacity="0.04"/>
    <path d="M20,175 H220 V232 Q220,235 217,235 H23 Q20,235 20,232 Z" fill="none" stroke="#005f7a" stroke-width="1"/>
    <rect x="20" y="175" width="200" height="5" fill="#005f7a" opacity="0.6"/>
    <text x="120" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" class="accent-1">Interoperability</text>
    <text x="120" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-3">CI pipelines work the same</text>
    <text x="120" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-4">Code review is faster</text>
  </g>

  <!-- Spoke 4: Portability (mid-right) -->
  <g id="spoke-portability">
    <path d="M580,175 H780 V232 Q780,235 777,235 H583 Q580,235 580,232 Z" fill="#005f7a" fill-opacity="0.04"/>
    <path d="M580,175 H780 V232 Q780,235 777,235 H583 Q580,235 580,232 Z" fill="none" stroke="#005f7a" stroke-width="1"/>
    <rect x="580" y="175" width="200" height="5" fill="#005f7a" opacity="0.6"/>
    <text x="680" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" class="accent-1">Portability</text>
    <text x="680" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-3">Hand off to another team</text>
    <text x="680" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-4">Works on any machine</text>
  </g>

  <!-- Spoke 5: Reproducibility (bot-left) -->
  <g id="spoke-repro">
    <path d="M50,310 H250 V367 Q250,370 247,370 H53 Q50,370 50,367 Z" fill="#005f7a" fill-opacity="0.04"/>
    <path d="M50,310 H250 V367 Q250,370 247,370 H53 Q50,370 50,367 Z" fill="none" stroke="#005f7a" stroke-width="1"/>
    <rect x="50" y="310" width="200" height="5" fill="#005f7a" opacity="0.6"/>
    <text x="150" y="333" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" class="accent-1">Reproducibility</text>
    <text x="150" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-3">make test - consistent everywhere</text>
    <text x="150" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-4">Dev/prod deps separated</text>
  </g>

  <!-- Spoke 6: Evolvability (bot-right) -->
  <g id="spoke-evolve">
    <path d="M550,310 H750 V367 Q750,370 747,370 H553 Q550,370 550,367 Z" fill="#005f7a" fill-opacity="0.04"/>
    <path d="M550,310 H750 V367 Q750,370 747,370 H553 Q550,370 550,367 Z" fill="none" stroke="#005f7a" stroke-width="1"/>
    <rect x="550" y="310" width="200" height="5" fill="#005f7a" opacity="0.6"/>
    <text x="650" y="333" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" class="accent-1">Evolvability</text>
    <text x="650" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-3">copier update - adopt improvements</text>
    <text x="650" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" class="fg-4">Template grows with best practices</text>
  </g>
</svg>
